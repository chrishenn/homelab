---
apiVersion: v1
kind: Pod
metadata:
  name: nvsmi
spec:
  restartPolicy: OnFailure
  containers:
    - name: nvsmi
      image: nvidia/cuda:12.2.0-base-ubuntu22.04
      command: [nvidia-smi]
      resources:
        limits:
          nvidia.com/gpu: 1

      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        seccompProfile:
          type: RuntimeDefault
