[tools]
just = { version = "latest", lazy = true }
bun = { version = "latest", lazy = true }
node = { version = "latest", lazy = true }
pnpm = { version = "latest", lazy = true }
fnox = { version = "latest", lazy = true }
rclone = { version = "latest", lazy = true }
cargo-binstall = { version = "latest", lazy = true }
age = { version = "latest", lazy = true }
regctl = { version = "latest", lazy = true }
crane = { version = "latest", lazy = true }
cue = { version = "latest", lazy = true }
glab = { version = "latest", exe = "glab" }
doggo = { version = "latest", lazy = true }
"github:rustfs/cli" = { version = "latest", lazy = true, lazy_bins = ["rc"] }
"cargo:forgejo-cli" = { version = "latest", lazy = true, lazy_bins = ["forgejo-cli"] }

[env]
OP_RUN_NO_MASKING = true
COMPOSE_BAKE = true
SYNC_MODE = "cron"

TZ = "America/Chicago"
PUID = 1000
PGID = 1000

# compose host
DOCKER_HOST = "tcp://192.168.1.142:2375"

# paths to data
DATA = "/mnt/k/docker"
BACKUP = "/mnt/h/backup"
MEDIA = "/mnt/r/media_library"
MUSIC = "/mnt/r/media_library/Music"

# This is to ensure the auto-generated range does not conflict with any existing subnets
HOME_GATEWAY = "192.168.0.1"
HOME_SUBNET = "192.168.0.0/16"
TRAEFIK_GATEWAY = "192.170.0.1"
TRAEFIK_SUBNET = "192.170.0.0/16"
NEWT_GATEWAY = "192.169.0.1"
NEWT_SUBNET = "192.169.0.0/16"

# SVC_IP is the default bound IP for docker services, including dns on port 53
SVC_IP = "192.168.1.142"
# lancache serves on 80, 443 on host
LANCACHE_IP = "192.168.1.143"

# VPS0_USER
VPS0_USER = "chris"
VPS0_PORT = "2200"
VPS0_DATA = "/home/chris/data"

# gitlab runner
GITLAB_URL = "https://gitlab.henn.dev"

# public oidc provider
OIDC = "https://pocketid.chenn.dev"
OIDC_DISCOVERY = "https://pocketid.chenn.dev/.well-known/openid-configuration"

STALWART_URL = "https://mail.chenn.dev"

[tasks.mtls]
description = "generate cers for mtls and p12 bundle"
run = """
openssl genrsa -out ca-key.pem 4096
openssl req -new -x509 -days 365 -key ca-key.pem -out ca-cert.pem -subj "/C=US/ST=State/L=City/O=Pangolin/OU=VPN/CN=Pangolin-CA"
openssl genrsa -out client-key.pem 4096
openssl req -new -key client-key.pem -out client.csr -subj "/C=US/ST=State/L=City/O=Pangolin/OU=VPN/CN=client"
openssl x509 -req -days 365 -in client.csr -CA ca-cert.pem -CAkey ca-key.pem -CAcreateserial -out client-cert.pem
openssl pkcs12 -export -out client.p12 -inkey client-key.pem -in client-cert.pem -certfile ca-cert.pem -passout pass:1234
rm ./*.srl ./*.csr
"""
