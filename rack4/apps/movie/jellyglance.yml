---
# ui is a bit busted. It's probably just new
services:
  jellyglance:
    profiles: [jellyglance]
    image: ghcr.io/nerdy-technician/jellyglance:latest
    container_name: jellyglance
    restart: unless-stopped
    environment:
      POSTGRES_IP: jellyglance_db
      POSTGRES_PORT: 5432
      POSTGRES_DB: jellyglance
      POSTGRES_USER: jellyglance
      POSTGRES_PASSWORD: jellyglance
      JWT_SECRET: 19c4f6638eae822ef68330e1a8bf26dd9558652e87ec4855ad6fef2231e8c404
      TZ: $TZ
    volumes:
      - $DATA/jellyglance/config:/app/config
      - $DATA/jellyglance/backups:/app/backups

    networks: [jellyglance, arr, newt]
    labels:
      homepage.group: Movies and TV
      homepage.name: Jellyglance
      homepage.icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/jellyglance.png
      homepage.href: https://jellyglance.chenn.dev
      homepage.description: Jellyfin Stats UI

      pangolin.public-resources.jellyglance.name: jellyglance
      pangolin.public-resources.jellyglance.full-domain: jellyglance.chenn.dev
      pangolin.public-resources.jellyglance.mode: http
      pangolin.public-resources.jellyglance.targets[0].method: http
      pangolin.public-resources.jellyglance.targets[0].port: 3000
      pangolin.public-resources.jellyglance.policy: member

  jellyglance_db:
    profiles: [jellyglance]
    image: postgres:18-alpine
    container_name: jellyglance_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: jellyglance
      POSTGRES_PASSWORD: jellyglance
      POSTGRES_DB: jellyglance
    volumes:
      - $DATA/jellyglance/db:/var/lib/postgresql
    healthcheck:
      test: pg_isready -q -U $$POSTGRES_USER -d $$POSTGRES_DB
      timeout: 30s
      interval: 10s
      retries: 5
    networks: [jellyglance]

networks:
  jellyglance:
