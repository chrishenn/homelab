---
services:
  resume:
    profiles: [resume]
    image: amruthpillai/reactive-resume:latest
    container_name: resume
    restart: unless-stopped
    environment:
      APP_URL: https://resume.chenn.dev
      AUTH_SECRET: ${RESUME_AUTH_SECRET}
      TZ: ${TZ}
      NODE_ENV: production
      FLAG_DISABLE_SIGNUPS: false

      DATABASE_URL: postgresql://postgres:postgres@resume_db:5432/postgres
      REDIS_URL: redis://resume_redis:6379
      ENCRYPTION_SECRET: 'change-me-to-a-secure-agent-secret-in-production'

      S3_ACCESS_KEY_ID: seaweedfs
      S3_SECRET_ACCESS_KEY: seaweedfs
      S3_ENDPOINT: http://resume_seaweed:8333
      S3_BUCKET: reactive-resume
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: true

      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: 465
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_USER}
      SMTP_SECURE: true

      OAUTH_DISCOVERY_URL: https://pocketid.chenn.dev/.well-known/openid-configuration
      OAUTH_PROVIDER_NAME: PocketID
      OAUTH_CLIENT_ID: ${RESUME_OIDC_CLIENT}
      OAUTH_CLIENT_SECRET: ${RESUME_OIDC_SECRET}
      OAUTH_SCOPES: openid profile email groups
    volumes:
      - $DATA/resume/data:/app/data
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://0.0.0.0:3000/api/health').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));"]
    networks: [resume, newt, ollama]
    labels:
      homepage.group: Job
      homepage.name: Reactive Resume
      homepage.icon: reactive-resume.png
      homepage.href: https://resume.chenn.dev
      homepage.description: Resume Editor

      pangolin.public-resources.resume.name: resume
      pangolin.public-resources.resume.full-domain: resume.chenn.dev
      pangolin.public-resources.resume.mode: http
      pangolin.public-resources.resume.targets[0].method: http
      pangolin.public-resources.resume.targets[0].port: 3000
      pangolin.public-resources.resume.policy: member

  resume_db:
    profiles: [resume]
    image: postgres:18-alpine
    container_name: resume_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - $DATA/resume/db:/var/lib/postgresql
    healthcheck:
      test: pg_isready -q -U $$POSTGRES_USER -d $$POSTGRES_DB
    networks: [resume]

  resume_redis:
    profiles: [resume]
    image: valkey/valkey:alpine
    container_name: resume_redis
    restart: unless-stopped
    command: valkey-server --appendonly yes
    volumes:
      - $DATA/resume/redis:/data
    healthcheck:
      test: valkey-cli ping
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [resume]

  resume_seaweed:
    profiles: [resume]
    image: chrislusf/seaweedfs:latest
    container_name: resume_seaweed
    restart: unless-stopped
    command: server -s3 -filer -dir=/data -ip=0.0.0.0
    environment:
      AWS_ACCESS_KEY_ID: seaweedfs
      AWS_SECRET_ACCESS_KEY: seaweedfs
      S3_BUCKET: reactive-resume
    volumes:
      - $DATA/resume/seaweedfs:/data
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost:8888']
      start_period: 10s
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [resume]

networks:
  resume:
