---
services:
  vert:
    profiles: [vert]
    image: ${REGISTRY}/vert/vert:latest
    build:
      context: https://github.com/VERT-sh/VERT.git
      args:
        PUB_HOSTNAME: vert.chenn.dev
        PUB_ENV: production
        PUB_DISABLE_ALL_EXTERNAL_REQUESTS: false
        PUB_VERTD_URL: https://vertd.chenn.dev
        PUB_DISABLE_FAILURE_BLOCKS: false
    container_name: vert
    restart: unless-stopped
    healthcheck:
      test: [CMD, curl, -ILfSs, http://localhost:80]
    networks: [newt]
    labels:
      homepage.group: File Converters
      homepage.name: Vert
      homepage.icon: https://icons.chenn.dev/vert.svg
      homepage.href: https://vert.chenn.dev
      homepage.description: Image + Video Converter

      pangolin.public-resources.vert.name: vert
      pangolin.public-resources.vert.full-domain: vert.chenn.dev
      pangolin.public-resources.vert.mode: http
      pangolin.public-resources.vert.targets[0].method: http
      pangolin.public-resources.vert.targets[0].port: 80
      pangolin.public-resources.vert.policy: member

  vertd:
    profiles: [vert]
    image: ghcr.io/vert-sh/vertd:latest
    container_name: vertd
    restart: unless-stopped
    environment:
      PORT: 24153
      ADMIN_PASSWORD: ${VERTD_ADMIN}
      PUBLIC_URL: https://vertd.chenn.dev
      ALLOW_CPU_FALLBACK: true
      MAX_UPLOAD_BYTES: 8589934592
      VERTD_FORCE_GPU: nvidia
      CORS_ORIGINS: https://vert.chenn.dev
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: [CMD, curl, http://localhost:24153/api/version]
    networks: [newt]
    labels:
      pangolin.public-resources.vertd.name: vertd
      pangolin.public-resources.vertd.full-domain: vertd.chenn.dev
      pangolin.public-resources.vertd.mode: http
      pangolin.public-resources.vertd.targets[0].method: http
      pangolin.public-resources.vertd.targets[0].port: 24153
      pangolin.public-resources.vertd.policy: us
