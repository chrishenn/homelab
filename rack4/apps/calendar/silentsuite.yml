# google calendar alternative, plus tasks and contacts. E2E encrypted. Native android and ios apps
# no env var for database hostname. Like, guys, come the f*ck on
# python server process crashes when config is missing required keys - no validation. GUYS!? COME ON GUYS!!
# documentation is a fragmented disaster. guys it's actually less work to just have ONE source of documentation

# oh ffs - if config ini is provided, env vars are ignored
# I just feel like I can't explain how crappy this is, with my voice echoing across the eons ...
# they serve the frontend from their public url, and expect you to use it to log into your server - but of course
# that won't work with pangolin auth. So I'll puch through /api
# admin login is busted
# have to type in the server url every time I log in. bad bad bad
# container user id undocumented
# the deal-breaker: calendar event repeat rules are not sophisticated enough
# can't make an event from the monthly view. Can't create an event by clicking on a day. Can't create an event inline.
# import works well. so there's that.

# sudo chown -R 100:101 $DATA/silentsuite/data
---
configs:
  silentsuite:
    content: |
      [global]
      debug = false
      media_root = /data/media
      static_root = /data/static
      
      [allowed_hosts]
      allowed_host1 = silentsuite.chenn.dev
      allowed_host2 = chenn.dev
      
      [database]
      engine = django.db.backends.postgresql
      host = silentsuite_db
      port = 5432
      name = silentsuite
      user = silentsuite
      password = silentsuite
  ss_success:
    content: |
      <!DOCTYPE html>
      <html lang="en">
        <head>
          <meta charset="utf-8" />
          <meta name="viewport" content="width=device-width, initial-scale=1" />
          <title>SilentSuite Sync Server</title>
          <style>
            *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
            body {
              font-family: Inter, system-ui, -apple-system, sans-serif;
              background: #0f172a;
              color: #e2e8f0;
              min-height: 100vh;
              display: flex;
              align-items: center;
              justify-content: center;
            }
            .container {
              text-align: center;
              max-width: 480px;
              padding: 2rem;
            }
            .logo {
              font-size: 3rem;
              margin-bottom: 1rem;
            }
            h1 {
              font-size: 1.5rem;
              font-weight: 600;
              color: #f8fafc;
              margin-bottom: 0.5rem;
            }
            .status {
              display: inline-flex;
              align-items: center;
              gap: 0.5rem;
              background: rgba(16, 185, 129, 0.1);
              border: 1px solid rgba(16, 185, 129, 0.3);
              color: #34d399;
              padding: 0.375rem 0.875rem;
              border-radius: 9999px;
              font-size: 0.875rem;
              font-weight: 500;
              margin-bottom: 1.5rem;
            }
            .dot {
              width: 8px;
              height: 8px;
              background: #34d399;
              border-radius: 50%;
              animation: pulse 2s ease-in-out infinite;
            }
            @keyframes pulse {
              0%, 100% { opacity: 1; }
              50% { opacity: 0.4; }
            }
            p {
              color: #94a3b8;
              font-size: 0.9375rem;
              line-height: 1.6;
              margin-bottom: 1.5rem;
            }
            .links {
              display: flex;
              gap: 1rem;
              justify-content: center;
              flex-wrap: wrap;
            }
            a {
              color: #34d399;
              text-decoration: none;
              font-size: 0.875rem;
              font-weight: 500;
              padding: 0.5rem 1rem;
              border: 1px solid rgba(16, 185, 129, 0.3);
              border-radius: 0.5rem;
              transition: all 0.15s ease;
            }
            a:hover {
              background: rgba(16, 185, 129, 0.1);
              border-color: #34d399;
            }
          </style>
        </head>
        <body>
          <div class="container">
            <div class="logo">🤫</div>
            <h1>SilentSuite Sync Server</h1>
            <div class="status"><span class="dot"></span> Running</div>
            <p>
              Your self-hosted sync server is up and running.
              Connect using the SilentSuite apps or a supported desktop client through the local bridge.
            </p>
            <div class="links">
              <a href="https://app.silentsuite.io">Open Web App</a>
              <a href="https://docs.silentsuite.io/self-hosting">Documentation</a>
            </div>
          </div>
        </body>
      </html>

services:
  silentsuite:
    profiles: [silentsuite]
    image: ghcr.io/silent-suite/silentsuite-server:v0.5.10-beta
    container_name: silentsuite
    restart: unless-stopped
    environment:
      TRUSTED_PROXY_IPS: '*'
      SUPER_USER: ${EMAIL}
      SUPER_PASS: ${PASS}
      ETEBASE_DISABLE_SIGNUP: false
      ETEBASE_DISABLE_DJANGO_ADMIN: true
    configs:
      - source: silentsuite
        target: /etc/etebase-server/etebase-server.ini
        mode: 0644
      - source: ss_success
        target: /app/etebase_server/templates/success.html
    volumes:
      - $DATA/silentsuite/data:/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import http.client,sys; c=http.client.HTTPConnection('localhost',3735,timeout=5); c.request('GET','/'); sys.exit(0 if c.getresponse().status<500 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks: [silentsuite, newt]
    labels:
      homepage.group: Calendar
      homepage.name: silentsuite
      homepage.icon: https://github.com/silent-suite/silentsuite/blob/main/apps/web/public/icon-maskable-512.png?raw=true
      homepage.href: https://silentsuite.chenn.dev
      homepage.description: Calendar, Tasks, Contacts

      pangolin.public-resources.silentsuite.name: silentsuite
      pangolin.public-resources.silentsuite.full-domain: silentsuite.chenn.dev
      pangolin.public-resources.silentsuite.mode: http
      pangolin.public-resources.silentsuite.targets[0].method: http
      pangolin.public-resources.silentsuite.targets[0].port: 3735
      pangolin.public-resources.silentsuite.policy: member

      pangolin.public-resources.silentsuite.rules[0].action: allow
      pangolin.public-resources.silentsuite.rules[0].match: path
      pangolin.public-resources.silentsuite.rules[0].value: /api/*

  silentsuite_db:
    profiles: [silentsuite]
    image: postgres:18-alpine
    container_name: silentsuite_db
    restart: unless-stopped
    shm_size: 128mb
    command: postgres -c max_connections=200
    environment:
      POSTGRES_DB: silentsuite
      POSTGRES_USER: silentsuite
      POSTGRES_PASSWORD: silentsuite
    volumes:
      - $DATA/silentsuite/db:/var/lib/postgresql
    healthcheck:
      test: pg_isready -q -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [silentsuite]

networks:
  silentsuite: