---
x-orcah: &orcah
  profiles: [orcah]
  restart: unless-stopped
  networks: [orcah]

x-orcah_env: &orcah_env
  WEB_APP_URL: http://orcah:3745
  BACKGROUND_JOBS_URL: http://orcah_background:4000
  NODE_ENV: production
  ANONYMIZED_TELEMETRY: FALSE

  DATABASE_URL: postgresql://orcah:orcah@orcah_db:5432/orcah
  POSTGRES_USER: orcah
  POSTGRES_PASSWORD: orcah
  POSTGRES_DB: orcah
  REDIS_URL: redis://orcah_redis:6379
  REDIS_HOST: orcah_redis
  CHROMA_HOST: orcah_chroma
  ML_HOST: orcah_ml

  SESSION_SECRET: ${ORCAH_SESSION_SECRET}
  ENCRYPTION_KEY: ${ORCAH_ENCRYPTION_KEY}

  MAX_CONCURRENT_ANALYSES: 1
  MAX_CONCURRENT_TRANSCRIPTIONS: 1
  PRELOAD_EMBEDDING_MODELS: false
  ANALYSIS_TIMEOUT_SECONDS: 2700
  TRANSCRIPTION_TIMEOUT_SECONDS: 2700
  ENABLE_AGGRESSIVE_GC: true
  # Flip to true only if you've confirmed NVDEC is stable in your environment.
  GPU_FRAME_DECODE: false

  PROCESSED_VIDEOS_DIR: /app/data
  THUMBNAILS_PATH: /app/data/.thumbnails
  STITCHED_VIDEOS_DIR: /app/data/.stitched-videos
  FACES_DIR: /app/data/.faces
  UNKNOWN_FACES_DIR: /app/data/.unknown_faces
  KNOWN_FACES_FILE: /app/data/.faces.json
  KNOWN_FACES_FILE_LOADED: /app/data/.known_faces.json
  CHROMA_PORT: 8000
  PORT: 3745
  BACKGROUND_JOBS_PORT: 4000
  ML_PORT: 8765
  REDIS_PORT: 6379
  POSTGRES_PORT: 5432

services:
  orcah:
    <<: *orcah
    image: ghcr.io/iliashad/edit-mind-web:latest
    container_name: orcah
    environment:
      <<: *orcah_env
    volumes:
      - $DATA/orcah/media:/media/videos:ro
      - $DATA/orcah/data:/app/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3745']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks: [orcah, newt]
    labels:
      homepage.group: Movies and TV
      homepage.name: Orcah
      homepage.icon: https://icons.chenn.dev/orca-slicer.svg
      homepage.href: https://orcah.chenn.dev
      homepage.description: AI Video

      pangolin.public-resources.orcah.name: orcah
      pangolin.public-resources.orcah.full-domain: orcah.chenn.dev
      pangolin.public-resources.orcah.mode: http
      pangolin.public-resources.orcah.targets[0].method: http
      pangolin.public-resources.orcah.targets[0].port: 3745
      pangolin.public-resources.orcah.policy: member

  orcah_ml:
    <<: *orcah
    image: ghcr.io/iliashad/edit-mind-ml:latest-gpu
    container_name: orcah_ml
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      <<: *orcah_env
      YOLO_CONFIG_DIR: /ml-models/ultralytics
      DEEPFACE_HOME: /ml-models/deepface
      TRANSCRIPTION_MODEL_CACHE: /ml-models/whisper
      TORCH_HOME: /ml-models/torch
      HF_HOME: /ml-models/huggingface
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - $DATA/orcah/media:/media/videos:ro
      - $DATA/orcah/models:/ml-models:rw
      - $DATA/orcah/data:/app/data

  orcah_background:
    <<: *orcah
    image: ghcr.io/iliashad/edit-mind-background-jobs:latest-gpu
    container_name: orcah_background
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      <<: *orcah_env
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - $DATA/orcah/media:/media/videos:rw
      - $DATA/orcah/data:/app/data
      - $DATA/orcah/models:/app/ml-models:rw

  orcah_chroma:
    <<: *orcah
    image: chromadb/chroma:1.3.5
    container_name: orcah_chroma
    environment:
      <<: *orcah_env
      IS_PERSISTENT: TRUE
      CHROMA_CORS_ALLOW_ORIGINS: '["http://orcah:3745", "http://orcah_background:4000"]'
    volumes:
      - $DATA/orcah/chroma:/data

  orcah_db:
    <<: *orcah
    image: postgres:18-alpine
    container_name: orcah_db
    environment:
      <<: *orcah_env
    volumes:
      - $DATA/orcah/db:/var/lib/postgresql
    healthcheck:
      test: pg_isready -q -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 10s
      timeout: 5s
      retries: 5

  orcah_redis:
    <<: *orcah
    image: valkey/valkey:alpine
    container_name: orcah_redis
    volumes:
      - $DATA/orcah/redis:/data
    healthcheck:
      test: valkey-cli ping
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  orcah:
