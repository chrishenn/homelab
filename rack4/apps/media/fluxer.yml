---
# https://fluxer.chenn.dev/admin
configs:
  fluxer_caddy:
    content: |
      {
      	servers {
      		trusted_proxies static private_ranges
      	}
      }
      :80 {
      	encode zstd gzip

      	handle_path /api/* {
      		reverse_proxy fluxer_api:8080
      	}

      	handle /gateway {
      		rewrite * /
      		reverse_proxy fluxer_gateway:8080
      	}

      	handle_path /gateway/* {
      		reverse_proxy fluxer_gateway:8080
      	}

      	handle_path /media/* {
      		reverse_proxy fluxer_media-proxy:8080
      	}

      	handle_path /livekit/* {
      		reverse_proxy fluxer_livekit:7880
      	}

      	handle /admin {
      		rewrite * /
      		reverse_proxy fluxer_admin:8080
      	}

      	handle_path /admin/* {
      		reverse_proxy fluxer_admin:8080
      	}

      	@staticAssets path /web/* /emoji/* /libs/* /avatars/* /badges/* /desktop/* /embeds/*
      	handle @staticAssets {
      		reverse_proxy fluxer_static-proxy:8080
      	}

      	handle /.well-known/fluxer {
      		reverse_proxy fluxer_api:8080
      	}

      	handle {
      		reverse_proxy fluxer_app-proxy:8080
      	}
      }

      :8088 {
      	handle_path /api/* {
      		reverse_proxy fluxer_api:8080
      	}
      }

  fluxer_livekit:
    #    content: |
    #      port: 7880
    #      log_level: info
    #      rtc:
    #        tcp_port: 7881
    #        udp_port: 7882
    #        use_external_ip: true
    #        stun_servers:
    #          - stun.l.google.com:19302
    #          - stun1.l.google.com:19302
    #      keys:
    #        fluxer: 08a992abf8ecd2b5a12b95bd868a0fb1cba6328dd3d5fbea4bf5dbef9de8f5a2
    #      webhook:
    #        api_key: fluxer
    #        urls:
    #          - http://fluxer_api:8080/webhooks/livekit

    content: |
      port: 7880
      log_level: info
      rtc:
        use_external_ip: false
        tcp_port: 7881
        udp_port: 7882
        stun_servers:
          - stun.l.google.com:19302
          - stun1.l.google.com:19302
      keys:
        fluxer: 08a992abf8ecd2b5a12b95bd868a0fb1cba6328dd3d5fbea4bf5dbef9de8f5a2
      webhook:
        api_key: fluxer
        urls:
          - http://fluxer_api:8080/webhooks/livekit

