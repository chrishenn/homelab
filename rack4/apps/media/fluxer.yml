  FLUXER_SSO_ALLOW_PRIVATE_ADDRESSES: false
  FLUXER_VAPID_PUBLIC_KEY: BBaOo20uRqRD-H3blnyTRZ_1xuOS-AxDnkGfxL8g6Pl9BeQXzmBB_repZCQ1s6o_Cz8fulZenL-p9sHcmJqM9Ms
  FLUXER_VAPID_PRIVATE_KEY: kFXWwNEx0olJZHwOWYd3T0RKSh3w03_MdMg2R3D8kQw
