x-fluxer_common: &fluxer_common
  profiles: [fluxer]
  restart: unless-stopped
  networks: [fluxer]

x-fluxer_common_once: &fluxer_common_once
  profiles: [fluxer]
  restart: no
  networks: [fluxer]

x-fluxer_common_newt: &fluxer_common_newt
  profiles: [fluxer]
  restart: unless-stopped
  networks: [fluxer, newt]

services:
  fluxer_caddy:
    image: caddy:2.10-alpine
    <<: *fluxer_common_newt
    configs:
      - source: fluxer_caddy
        target: /etc/caddy/Caddyfile
    volumes:
      - $DATA/fluxer/caddy/data:/data
      - $DATA/fluxer/caddy/config:/config
    labels:
      pangolin.public-resources.fluxer.name: fluxer
      pangolin.public-resources.fluxer.full-domain: fluxer.chenn.dev
      pangolin.public-resources.fluxer.mode: http
      pangolin.public-resources.fluxer.targets[0].method: http
      pangolin.public-resources.fluxer.targets[0].port: 80

  fluxer_db:
    image: postgres:18-alpine
    <<: *fluxer_common
    environment:
      POSTGRES_DB: fluxer
      POSTGRES_USER: fluxer
      POSTGRES_PASSWORD: fluxer
    volumes:
      - $DATA/fluxer/db:/var/lib/postgresql
    healthcheck:
      test: pg_isready -q -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 10s
      timeout: 5s
      retries: 10

  fluxer_redis:
    image: valkey/valkey:alpine
    <<: *fluxer_common
    command: ['valkey-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  fluxer_nats:
    image: nats:2.14-alpine
    <<: *fluxer_common
    command: ['-js', '-sd', '/data', '-m', '8222']
    volumes:
      - $DATA/fluxer/nats:/data

  fluxer_meili:
    image: getmeili/meilisearch:v1.12
    <<: *fluxer_common
    environment:
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: true
      MEILI_MASTER_KEY: dcb85f42ae4494b66366f00d238c1563fd42dd8d5c19c18e3e97cf6d51ee4c27
    volumes:
      - $DATA/fluxer/meili:/meili_data

  fluxer-s3:
    image: chrislusf/seaweedfs:4.34
    <<: *fluxer_common
    command: ['server', '-s3', '-dir=/data']
    volumes:
      - $DATA/fluxer/s3:/data

  fluxer-s3-init:
    image: chrislusf/seaweedfs:4.34
    <<: *fluxer_common_once
    entrypoint:
      - /bin/sh
      - -c
      - >
        buckets="fluxer fluxer-uploads fluxer-downloads fluxer-reports fluxer-harvests";
        missing="$$buckets";
        for attempt in $$(seq 1 60); do
          if ! nc -z fluxer-s3 9333 2>/dev/null; then
            sleep 2;
            continue;
          fi;
          listed=$$(echo "s3.bucket.list" | timeout 10 weed shell -master=fluxer-s3:9333 2>&1);
          missing="";
          for b in $$buckets; do
            echo "$$listed" | grep -q "^[[:space:]]*$$b[[:space:]]" || missing="$${missing:+$$missing }$$b";
          done;
          if [ -z "$$missing" ]; then
            echo "buckets ready";
            exit 0;
          fi;
          for b in $$missing; do
            echo "s3.bucket.create -name $$b" | timeout 10 weed shell -master=fluxer-s3:9333 >/dev/null 2>&1;
          done;
          sleep 2;
        done;
        echo "fluxer-s3-init could not verify buckets: $$missing" >&2;
        exit 1;

  fluxer_livekit:
    image: livekit/livekit-server:v1.12.0
    <<: *fluxer_common_newt
    command: --config /etc/livekit.yml --node-ip ${VPS0_IP}
    configs:
      - source: fluxer_livekit
        target: /etc/livekit.yaml
    labels:
      pangolin.public-resources.tcp-7881.name: tcp-7881
      pangolin.public-resources.tcp-7881.mode: tcp
      pangolin.public-resources.tcp-7881.proxy-port: 7881
      pangolin.public-resources.tcp-7881.targets[0].port: 7881

      pangolin.public-resources.udp-7882.name: udp-7882
      pangolin.public-resources.udp-7882.mode: udp
      pangolin.public-resources.udp-7882.proxy-port: 7882
      pangolin.public-resources.udp-7882.targets[0].port: 7882

  fluxer_api:
    image: ghcr.io/fluxerapp/fluxer-api:v1
    <<: *fluxer_common
    environment:
      <<: *fluxer_env
      FLUXER_API_PORT: 8080
      FLUXER_API_PRESIGNED_ATTACHMENT_UPLOADS_ENABLED: true
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(''http://127.0.0.1:8080/_health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    depends_on:
      fluxer_db: {condition: service_healthy}
      fluxer_redis: {condition: service_healthy}
      fluxer_nats: {condition: service_started}
      fluxer_meili: {condition: service_started}
      fluxer-s3-init: {condition: service_completed_successfully}
      fluxer_gifs: {condition: service_started}
      fluxer_gifs-shard: {condition: service_started}
      fluxer_snowflakes: {condition: service_started}
      fluxer_snowflakes-shard: {condition: service_started}
      fluxer_messages: {condition: service_started}
      fluxer_messages-shard: {condition: service_started}
      fluxer_users: {condition: service_started}
      fluxer_users-shard: {condition: service_started}

  fluxer_worker:
    image: ghcr.io/fluxerapp/fluxer-api:v1
    <<: *fluxer_common
    working_dir: /usr/src/app/fluxer_api
    command: ['./node_modules/.bin/tsx', 'src/WorkerEntrypoint.ts']
    environment:
      <<: *fluxer_env
      FLUXER_API_WORKER_MODE: all_lanes
      FLUXER_API_WORKER_ENABLE_CRON_SCHEDULER: true
      FLUXER_API_WORKER_ENABLE_VOICE_RECONCILIATION: true
    depends_on:
      fluxer_db: {condition: service_healthy}
      fluxer_redis: {condition: service_healthy}
      fluxer_nats: {condition: service_started}
      fluxer-s3-init: {condition: service_completed_successfully}
      fluxer_snowflakes-shard: {condition: service_started}
      fluxer_messages-shard: {condition: service_started}
      fluxer_users-shard: {condition: service_started}

  fluxer_gateway:
    image: ghcr.io/fluxerapp/fluxer-gateway:v1
    <<: *fluxer_common
    environment:
      <<: *fluxer_env
      FLUXER_GATEWAY_PORT: 8080
      FLUXER_GATEWAY_MEDIA_PROXY_ENDPOINT: https://fluxer.chenn.dev/media
      FLUXER_GATEWAY_STATIC_CDN_ENDPOINT: https://fluxer.chenn.dev
      FLUXER_GATEWAY_LOGGER_LEVEL: info
    depends_on:
      fluxer_nats: {condition: service_started}
      fluxer_redis: {condition: service_healthy}

  fluxer_media:
    <<: *fluxer_common
    image: ghcr.io/fluxerapp/fluxer-media-proxy:v1
    environment:
      <<: *fluxer_env
      FLUXER_MEDIA_PROXY_HOST: 0.0.0.0
      FLUXER_MEDIA_PROXY_PORT: 8080
      FLUXER_MEDIA_PROXY_MODE: upload
      FLUXER_MEDIA_PROXY_STORAGE_BACKEND: s3
    healthcheck:
      disable: true
    depends_on:
      fluxer-s3-init: {condition: service_completed_successfully}
      fluxer_nats: {condition: service_started}

  fluxer_static-proxy:
    image: ghcr.io/fluxerapp/fluxer-static:v1
    <<: *fluxer_common

  fluxer_app-proxy:
    image: ghcr.io/fluxerapp/fluxer-app-proxy-self-hosted:v1
    <<: *fluxer_common
    environment:
      FLUXER_APP_PROXY_HOST: 0.0.0.0
      FLUXER_APP_PROXY_PORT: 8080
      DISCOVERY_UPSTREAM_URL: http://fluxer_caddy:8088/api/.well-known/fluxer
      PUBLIC_BOOTSTRAP_API_ENDPOINT: /api
      PUBLIC_BOOTSTRAP_API_PUBLIC_ENDPOINT: https://fluxer.chenn.dev/api
    depends_on:
      fluxer_api: {condition: service_healthy}
      fluxer_caddy: {condition: service_started}
      fluxer_db: {condition: service_healthy}

  fluxer_snowflakes:
    image: ghcr.io/fluxerapp/fluxer-snowflakes:v1
    <<: *fluxer_common
    environment:
      <<: *fluxer_env
      FLUXER_SVC_MODE: router
    depends_on:
      fluxer_nats: {condition: service_started}

  fluxer_snowflakes-shard:
    image: ghcr.io/fluxerapp/fluxer-snowflakes:v1
    <<: *fluxer_common
    environment:
      <<: *fluxer_env
      FLUXER_SVC_MODE: shard
      FLUXER_SVC_SHARD_ID: '0'
    depends_on:
      fluxer_nats: {condition: service_started}

  fluxer_users:
    image: ghcr.io/fluxerapp/fluxer-users:v1
    <<: *fluxer_common
    environment:
      <<: *fluxer_env
      FLUXER_SVC_MODE: router
    depends_on:
      fluxer_nats: {condition: service_started}

  fluxer_users-shard:
    image: ghcr.io/fluxerapp/fluxer-users:v1
    <<: *fluxer_common
    environment:
      <<: *fluxer_env
      FLUXER_SVC_MODE: shard
      FLUXER_SVC_SHARD_ID: '0'
    depends_on:
      fluxer_nats: {condition: service_started}
      fluxer_db: {condition: service_healthy}

  fluxer_gifs:
    image: ghcr.io/fluxerapp/fluxer-gifs:v1
    <<: *fluxer_common
    environment:
      <<: *fluxer_env
      FLUXER_SVC_NAME: gifs
      FLUXER_SVC_MODE: router
      FLUXER_MEDIA_PROXY_PUBLIC_ENDPOINT: https://fluxer.chenn.dev/media
    depends_on:
      fluxer_nats: {condition: service_started}

  fluxer_gifs-shard:
    image: ghcr.io/fluxerapp/fluxer-gifs:v1
    <<: *fluxer_common
    environment:
      <<: *fluxer_env
      FLUXER_SVC_NAME: gifs
      FLUXER_SVC_MODE: shard
      FLUXER_SVC_SHARD_ID: '0'
      FLUXER_MEDIA_PROXY_PUBLIC_ENDPOINT: https://fluxer.chenn.dev/media
    depends_on:
      fluxer_nats: {condition: service_started}

  fluxer_messages:
    image: ghcr.io/fluxerapp/fluxer-messages:v1
    <<: *fluxer_common
    environment:
      <<: *fluxer_env
      FLUXER_SVC_MODE: router
    depends_on:
      fluxer_nats: {condition: service_started}

  fluxer_messages-shard:
    image: ghcr.io/fluxerapp/fluxer-messages:v1
    <<: *fluxer_common
    environment:
      <<: *fluxer_env
      FLUXER_SVC_MODE: shard
      FLUXER_SVC_SHARD_ID: '0'
    depends_on:
      fluxer_nats: {condition: service_started}
      fluxer_db: {condition: service_healthy}

  fluxer_unfurl:
    image: ghcr.io/fluxerapp/fluxer-unfurl:v1
    <<: *fluxer_common
    environment:
      <<: *fluxer_env
      FLUXER_SVC_MODE: router
    depends_on:
      fluxer_nats: {condition: service_started}

  fluxer_unfurl-shard:
    image: ghcr.io/fluxerapp/fluxer-unfurl:v1
    <<: *fluxer_common
    environment:
      <<: *fluxer_env
      FLUXER_SVC_MODE: shard
      FLUXER_SVC_SHARD_ID: '0'
    depends_on:
      fluxer_nats: {condition: service_started}

  fluxer_admin:
    image: ghcr.io/fluxerapp/fluxer-admin:v1
    <<: *fluxer_common
    environment:
      <<: *fluxer_env
      FLUXER_ADMIN_HOST: 0.0.0.0
      FLUXER_ADMIN_PORT: 8080
      FLUXER_ADMIN_BASE_PATH: /admin
      FLUXER_API_ENDPOINT: http://fluxer_api:8080
      FLUXER_ADMIN_ENDPOINT: https://fluxer.chenn.dev/admin
      FLUXER_APP_ENDPOINT: https://fluxer.chenn.dev
      FLUXER_MEDIA_ENDPOINT: https://fluxer.chenn.dev/media
      FLUXER_STATIC_CDN_ENDPOINT: https://fluxer.chenn.dev
      FLUXER_ADMIN_OAUTH_REDIRECT_URI: https://fluxer.chenn.dev/admin/oauth2_callback
    depends_on:
      fluxer_api: {condition: service_healthy}

networks:
  fluxer:
