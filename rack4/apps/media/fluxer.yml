---
# video playback is mega busted on firefox, and I think all linux. Your only chance is chrome on windows.
# https://github.com/fluxerapp/fluxer/issues/1366

# chrome on linux will playback with blank screen - ok it stopped doing that. now no response
# fluxer_media: status 206, no errors
# fluxer_api  | {
#  "type":"Error", "message": "Command failed: ffmpeg ..."
#             "Unable to find a suitable output format for /tmp/id"
#             "/tmp/id: Invalid argument"

# firefox on windows: player does not respond
# firefox: play failed: the media resource ... was not suitable
# firefox: media resource https://fluxer.chenn.dev/media/attachmetns/id/id/name.mkv could not be dcoded, NS_ERROR_DOM_MEDIA_METADATA_ERR

# firefox on linux will play back smaller videos, but only on first login/fresh cookies
# larger files load nearly 100 MB in the background, then error with NS_ERROR_NET_PARTIAL_TRANSFER
# If I manually restart the aborted 206 request chunks, the video will magically start playing! It buffers correctly
# there's just something in the chain that's dropped these downloads after 28 seconds or so...

# I can curl about the same 100 MB
# curl https://fluxer.chenn.dev/media/attachments/1539129081084248067/1539131161991708672/file.mp4 -o dl.mp4
#  % Total    % Received % Xferd  Average Speed  Time    Time    Time   Current Dload  Upload  Total   Spent   Left   Speed
# 31 380.7M  31 118.8M   0      0  3.56M      0   01:46   00:33   01:13  3.08M
# curl: (92) HTTP/2 stream 1 reset by server (error 0x2 INTERNAL_ERROR)

# Hey, uh ... guys? Why are my uploaded files available on a public url without a login session?

# I'm seeing very close to a 30-second timeout in a couple places here
# fluxer-s3:
# "level": "WARN",
# "message": "GetObject streaming body dropped before expected length",
# "event": "get_object_stream_body",
# "component": "app",
# "subsystem": "object",
# "bucket": "fluxer",
# "object": "attachments/id1/id2/file.mp4",
# "range": "bytes 17301504-399284032/399284033",
# "expected": 381982529,
# "emitted": 78643200,
# "elapsed_ms": "30000",
# "state": "dropped_incomplete",

# it looks like either the web client or fluxer_media is timing out at 30s -
#  fluxer-s3 and fluxer_caddy both report an interruption and I don't think they're responsible
configs:
  fluxer_caddy:
    content: |
      {
      	servers {
          trusted_proxies static private_ranges
          timeouts {
              read_body   30m
              read_header 10s
              write       30m
              idle        30m
          }
        }
      }

      :80 {
      	encode zstd gzip

        read_timeout 30m
        read_header_timeout 10s
        write_timeout 30m
        idle_timeout 30m

      	handle_path /api/* {
      		reverse_proxy fluxer_api:8080
      	}

      	handle /gateway {
      		rewrite * /
      		reverse_proxy fluxer_gateway:8080
      	}

      	handle_path /gateway/* {
      		reverse_proxy fluxer_gateway:8080
      	}

      	handle_path /media/* {
      		reverse_proxy fluxer_media:8080 {
                flush_interval -1
                transport http {
                    keepalive 20m
                }
            }
      	}

      	handle_path /livekit/* {
      		reverse_proxy fluxer_livekit:7880
      	}

      	handle /admin {
      		rewrite * /
      		reverse_proxy fluxer_admin:8080
      	}

      	handle_path /admin/* {
      		reverse_proxy fluxer_admin:8080
      	}

      	@staticAssets path /web/* /emoji/* /libs/* /avatars/* /badges/* /desktop/* /embeds/*
      	handle @staticAssets {
      		reverse_proxy fluxer_static:8080
      	}

      	handle /.well-known/fluxer {
      		reverse_proxy fluxer_api:8080
      	}

      	handle {
      		reverse_proxy fluxer_app:8080
      	}
      }

      :8088 {
      	handle_path /api/* {
      		reverse_proxy fluxer_api:8080
      	}
      }

  fluxer_livekit:
    content: |
      port: 7880
      log_level: info
      rtc:
        use_external_ip: false
        tcp_port: 7881
        udp_port: 7882
        stun_servers:
          - stun.l.google.com:19302
          - stun1.l.google.com:19302
      keys:
        fluxer: ${FLUXER_LIVEKIT}
      webhook:
        api_key: fluxer
        urls:
          - http://fluxer_api:8080/webhooks/livekit

x-fluxer_common: &fluxer_common
  profiles: [fluxer]
  restart: unless-stopped
  networks: [fluxer]

x-fluxer_common_once: &fluxer_common_once
  profiles: [fluxer]
  restart: no
  networks: [fluxer]

x-fluxer_common_newt: &fluxer_common_newt
  profiles: [fluxer]
  restart: unless-stopped
  networks: [fluxer, newt]

x-started: &started
  condition: service_started

x-healthy: &healthy
  condition: service_healthy

x-completed: &completed
  condition: service_completed_successfully

x-fluxer_env: &fluxer_env
  FLUXER_ENV: production
  NODE_ENV: production
  FLUXER_SELF_HOSTED: true
  FLUXER_BASE_DOMAIN: fluxer.chenn.dev
  FLUXER_DOMAIN: fluxer.chenn.dev
  FLUXER_PUBLIC_SCHEME: https
  FLUXER_PUBLIC_PORT: 443
  FLUXER_TRUST_CLIENT_IP_HEADER: true
  FLUXER_CLIENT_IP_HEADER_NAME: x-forwarded-for

  FLUXER_DATABASE_BACKEND: postgres
  FLUXER_POSTGRES_URL: postgres://fluxer:${FLUXER_DB}@fluxer_db/fluxer
  FLUXER_POSTGRES_SSL: false

  FLUXER_KV_URL: redis://fluxer_redis:6379/0
  FLUXER_NATS_URL: nats://fluxer_nats:4222
  FLUXER_NATS_JETSTREAM_URL: nats://fluxer_nats:4222
  FLUXER_SVC_NATS_URL: nats://fluxer_nats:4222
  FLUXER_SVC_SHARD_COUNT: 1

  FLUXER_SEARCH_ENGINE: meilisearch
  FLUXER_SEARCH_URL: http://fluxer_meili:7700
  FLUXER_SEARCH_API_KEY: ${FLUXER_MEILI}

  FLUXER_S3_ENDPOINT: http://fluxer-s3:9000
  FLUXER_S3_PUBLIC_ENDPOINT: http://fluxer-s3:9000
  FLUXER_S3_REGION: fluxer
  FLUXER_S3_ACCESS_KEY_ID: fluxer
  FLUXER_S3_SECRET_ACCESS_KEY: ${FLUXER_S3}
  FLUXER_S3_FORCE_PATH_STYLE: true
  FLUXER_S3_BUCKET_CDN: fluxer
  FLUXER_S3_BUCKET_UPLOADS: fluxer-uploads
  FLUXER_S3_BUCKET_DOWNLOADS: fluxer-downloads
  FLUXER_S3_BUCKET_REPORTS: fluxer-reports
  FLUXER_S3_BUCKET_HARVESTS: fluxer-harvests
  AWS_ACCESS_KEY_ID: fluxer
  AWS_SECRET_ACCESS_KEY: ${FLUXER_S3}
  AWS_DEFAULT_REGION: fluxer
  AWS_EC2_METADATA_DISABLED: true

  FLUXER_LIVEKIT_ENABLED: true
  FLUXER_LIVEKIT_API_KEY: fluxer
  FLUXER_LIVEKIT_API_SECRET: ${FLUXER_LIVEKIT}
  FLUXER_LIVEKIT_WEBHOOK_URL: http://fluxer_api:8080/webhooks/livekit
  FLUXER_LIVEKIT_DEFAULT_REGION: '{"id":"default","name":"Default","emoji":"🌍","latitude":0,"longitude":0}'

  FLUXER_APP_PRODUCT_NAME: Chicken Flux
  #  FLUXER_APP_ICON_URL:
  #  FLUXER_APP_SYMBOL_URL:
  #  FLUXER_APP_LOGO_URL:
  #  FLUXER_APP_WORDMARK_URL:
  #  FLUXER_APP_FAVICON_URL:
  #  FLUXER_APP_THEME_COLOR:

  FLUXER_KLIPY_API_KEY: ${KLIPY_KEY}
  FLUXER_YOUTUBE_API_KEY: ${YOUTUBE_KEY}
  FLUXER_SMS_ENABLED: false
  FLUXER_CAPTCHA_ENABLED: false
  FLUXER_CAPTCHA_PROVIDER: none
  FLUXER_STRIPE_ENABLED: false
  FLUXER_NCMEC_ENABLED: false
  FLUXER_CLAMAV_ENABLED: false
  FLUXER_DISCOVERY_ENABLED: false

  FLUXER_EMAIL_ENABLED: true
  FLUXER_EMAIL_PROVIDER: smtp
  FLUXER_EMAIL_FROM_EMAIL: ${SMTP_USER}
  FLUXER_EMAIL_FROM_NAME: Chicken Fluxer
  FLUXER_EMAIL_SMTP_HOST: ${SMTP_HOST}
  FLUXER_EMAIL_SMTP_PORT: ${SMTP_PORT}
  FLUXER_EMAIL_SMTP_USERNAME: ${SMTP_USER}
  FLUXER_EMAIL_SMTP_PASSWORD: ${SMTP_PASS}
  FLUXER_EMAIL_SMTP_SECURE: true

  FLUXER_SUDO_MODE_SECRET: ${FLUXER_SUDO}
  FLUXER_CONNECTION_INITIATION_SECRET: ${FLUXER_CONNECTION}
  FLUXER_SSO_ALLOW_PRIVATE_ADDRESSES: false
  FLUXER_VAPID_PUBLIC_KEY: ${FLUXER_VAPID_PUBLIC}
  FLUXER_VAPID_PRIVATE_KEY: ${FLUXER_VAPID_PRIVATE}
  FLUXER_VAPID_EMAIL: ${SMTP_USER}
  FLUXER_PASSKEY_RP_ID: fluxer.chenn.dev
  FLUXER_PASSKEY_RP_NAME: Fluxer
  FLUXER_PASSKEY_ADDITIONAL_ALLOWED_ORIGINS: https://fluxer.chenn.dev
  FLUXER_GATEWAY_RPC_AUTH_TOKEN: ${FLUXER_GATEWAY}
  FLUXER_MEDIA_PROXY_SECRET_KEY: ${FLUXER_MEDIA_SECRET}
  # openssl rand -base64 32
  FLUXER_MEDIA_PROXY_UPLOAD_RELAY_SECRET_BASE64: ${FLUXER_MEDIA_UPLOAD}
  FLUXER_ADMIN_SECRET_KEY_BASE: ${FLUXER_ADMIN_BASE}
  FLUXER_ADMIN_OAUTH_CLIENT_SECRET: ${FLUXER_ADMIN_OAUTH}

  FLUXER_INTERNAL_API_ENDPOINT: http://fluxer_api:8080
  FLUXER_INTERNAL_GATEWAY_ENDPOINT: http://fluxer_gateway:8080
  FLUXER_INTERNAL_MEDIA_PROXY_ENDPOINT: http://fluxer_media:8080
  FLUXER_MARKETING_ENDPOINT: https://fluxer.chenn.dev
  FLUXER_MEDIA_PROXY_ENDPOINT: http://fluxer_media:8080
  FLUXER_MEDIA_ENDPOINT: https://fluxer.chenn.dev/media
  FLUXER_MEDIA_PROXY_UPLOAD_RELAY_ENDPOINT: https://fluxer.chenn.dev/media

services:
  fluxer_caddy:
    image: caddy:2.10-alpine
    container_name: fluxer_caddy
    <<: *fluxer_common_newt
    configs:
      - source: fluxer_caddy
        target: /etc/caddy/Caddyfile
    volumes:
      - $DATA/fluxer/caddy/data:/data
      - $DATA/fluxer/caddy/config:/config
    labels:
      homepage.group: General Media
      homepage.name: Fluxer
      homepage.icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/fluxer-dark.png
      homepage.href: https://fluxer.chenn.dev
      homepage.description: Discord Clone

      pangolin.public-resources.fluxer.name: fluxer
      pangolin.public-resources.fluxer.full-domain: fluxer.chenn.dev
      pangolin.public-resources.fluxer.mode: http
      pangolin.public-resources.fluxer.targets[0].method: http
      pangolin.public-resources.fluxer.targets[0].port: 80

  fluxer_db:
    image: postgres:18-alpine
    container_name: fluxer_db
    <<: *fluxer_common
    environment:
      POSTGRES_DB: fluxer
      POSTGRES_USER: fluxer
      POSTGRES_PASSWORD: ${FLUXER_DB}
    volumes:
      - $DATA/fluxer/db:/var/lib/postgresql
    healthcheck:
      test: pg_isready -q -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 10s
      timeout: 5s
      retries: 10

  fluxer_redis:
    image: valkey/valkey:alpine
    container_name: fluxer_redis
    <<: *fluxer_common
    command: valkey-server --save "" --appendonly no
    healthcheck:
      test: valkey-cli ping
      interval: 10s
      timeout: 5s
      retries: 10

  fluxer_nats:
    image: nats:2.14-alpine
    container_name: fluxer_nats
    <<: *fluxer_common
    command: ['-js', '-sd', '/data', '-m', '8222']
    volumes:
      - $DATA/fluxer/nats:/data

  fluxer_meili:
    image: getmeili/meilisearch:v1
    container_name: fluxer_meili
    <<: *fluxer_common
    environment:
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: true
      MEILI_MASTER_KEY: ${FLUXER_MEILI}
    volumes:
      - $DATA/fluxer/meili:/meili_data

  fluxer-s3:
    image: rustfs/rustfs:latest
    container_name: fluxer-s3
    <<: *fluxer_common
    command: /data
    environment:
      RUSTFS_OBS_LOGGER_LEVEL: info
      RUSTFS_DRIVE_WALKDIR_TIMEOUT_SECS: 60
      RUSTFS_DRIVE_WALKDIR_STALL_TIMEOUT_SECS: 60
      RUSTFS_CAPACITY_STAT_TIMEOUT: 60
      RUSTFS_CAPACITY_MAX_TIMEOUT: 120
      RUSTFS_CAPACITY_STALL_TIMEOUT: 60
      RUSTFS_SCANNER_DELAY: 60
      RUSTFS_SCANNER_MAX_WAIT_SECS: 120
      RUSTFS_SCANNER_CYCLE: 3600
      RUSTFS_SCANNER_CACHE_SAVE_TIMEOUT_SECS: 120

      RUSTFS_OBS_LOG_STDOUT_ENABLED: true
      RUSTFS_ACCESS_KEY: fluxer
      RUSTFS_SECRET_KEY: ${FLUXER_S3}
      RUSTFS_REGION: fluxer
      RUSTFS_ADDRESS: :9000
      RUSTFS_CORS_ALLOWED_ORIGINS: '*'
    volumes:
      - $DATA/fluxer/s3:/data
    healthcheck:
      test: curl -f http://localhost:9000/health
      timeout: 5s
      retries: 10
      start_period: 10s
      interval: 60s
    depends_on:
      fluxer-s3-perm: *completed

  fluxer-s3-perm:
    image: alpine
    container_name: fluxer-s3-perm
    <<: *fluxer_common_once
    user: root
    volumes:
      - $DATA/fluxer/s3:/data
    command: chown -R 10001:10001 /data

  # dc run --rm -it --entrypoint /bin/bash fluxer-s3-init
  # mc alias set fs $S3_ENDPOINT $S3_ACCESS_KEY $S3_SECRET_KEY
  # mc ls fs
  fluxer-s3-init:
    image: minio/mc
    container_name: fluxer-s3-init
    <<: *fluxer_common_once
    environment:
      S3_ACCESS_KEY: fluxer
      S3_SECRET_KEY: ${FLUXER_S3}
      S3_ENDPOINT: http://fluxer-s3:9000
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        until mc alias set fs $$S3_ENDPOINT $$S3_ACCESS_KEY $$S3_SECRET_KEY; do
          echo 'waiting to connect to s3 host'
          sleep 2
        done
        mc mb fs/fluxer --ignore-existing
        mc mb fs/fluxer-uploads --ignore-existing
        mc mb fs/fluxer-downloads --ignore-existing
        mc mb fs/fluxer-reports --ignore-existing
        mc mb fs/fluxer-harvests --ignore-existing
    depends_on:
      fluxer-s3: *healthy

  fluxer_livekit:
    image: livekit/livekit-server:v1.13
    container_name: fluxer_livekit
    <<: *fluxer_common_newt
    command: --config /etc/livekit.yml --node-ip ${VPS0_IP}
    configs:
      - source: fluxer_livekit
        target: /etc/livekit.yml
    labels:
      pangolin.public-resources.tcp-7881.name: tcp-7881
      pangolin.public-resources.tcp-7881.mode: tcp
      pangolin.public-resources.tcp-7881.proxy-port: 7881
      pangolin.public-resources.tcp-7881.targets[0].port: 7881

      pangolin.public-resources.udp-7882.name: udp-7882
      pangolin.public-resources.udp-7882.mode: udp
      pangolin.public-resources.udp-7882.proxy-port: 7882
      pangolin.public-resources.udp-7882.targets[0].port: 7882

  fluxer_api:
    image: ghcr.io/fluxerapp/fluxer-api:v1
    container_name: fluxer_api
    <<: *fluxer_common
    environment:
      <<: *fluxer_env
      FLUXER_API_PORT: 8080
      FLUXER_API_PRESIGNED_ATTACHMENT_UPLOADS_ENABLED: true
    healthcheck:
      test: node -e "fetch('http://127.0.0.1:8080/_health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    depends_on:
      fluxer_db: *healthy
      fluxer_redis: *healthy
      fluxer_nats: *started
      fluxer_meili: *started
      fluxer-s3-init: *completed
      fluxer_gifs: *started
      fluxer_gifs-shard: *started
      fluxer_snowflakes: *started
      fluxer_snowflakes-shard: *started
      fluxer_messages: *started
      fluxer_messages-shard: *started
      fluxer_users: *started
      fluxer_users-shard: *started

  fluxer_worker:
    image: ghcr.io/fluxerapp/fluxer-api:v1
    container_name: fluxer_worker
    <<: *fluxer_common
    working_dir: /usr/src/app/fluxer_api
    command: ['./node_modules/.bin/tsx', 'src/WorkerEntrypoint.ts']
    environment:
      <<: *fluxer_env
      FLUXER_API_WORKER_MODE: all_lanes
      FLUXER_API_WORKER_ENABLE_CRON_SCHEDULER: true
      FLUXER_API_WORKER_ENABLE_VOICE_RECONCILIATION: true
    depends_on:
      fluxer_db: *healthy
      fluxer_redis: *healthy
      fluxer_nats: *started
      fluxer-s3-init: *completed
      fluxer_snowflakes-shard: *started
      fluxer_messages-shard: *started
      fluxer_users-shard: *started

  fluxer_gateway:
    image: ghcr.io/fluxerapp/fluxer-gateway:v1
    container_name: fluxer_gateway
    <<: *fluxer_common
    environment:
      <<: *fluxer_env
      FLUXER_GATEWAY_PORT: 8080
      FLUXER_GATEWAY_MEDIA_PROXY_ENDPOINT: https://fluxer.chenn.dev/media
      FLUXER_GATEWAY_STATIC_CDN_ENDPOINT: https://fluxer.chenn.dev
      FLUXER_GATEWAY_LOGGER_LEVEL: info
    depends_on:
      fluxer_nats: *started
      fluxer_redis: *healthy

  fluxer_media:
    <<: *fluxer_common
    container_name: fluxer_media
    image: ghcr.io/fluxerapp/fluxer-media-proxy:v1
    environment:
      <<: *fluxer_env
      FLUXER_MEDIA_PROXY_HOST: 0.0.0.0
      FLUXER_MEDIA_PROXY_PORT: 8080
      FLUXER_MEDIA_PROXY_MODE: upload
      FLUXER_MEDIA_PROXY_STORAGE_BACKEND: s3
    healthcheck:
      disable: true
    depends_on:
      fluxer-s3-init: *completed
      fluxer_nats: *started

  fluxer_static:
    image: ghcr.io/fluxerapp/fluxer-static:v1
    container_name: fluxer_static
    <<: *fluxer_common

  fluxer_app:
    image: ghcr.io/fluxerapp/fluxer-app-proxy-self-hosted:v1
    container_name: fluxer_app
    <<: *fluxer_common
    environment:
      <<: *fluxer_env
      FLUXER_APP_PROXY_HOST: 0.0.0.0
      FLUXER_APP_PROXY_PORT: 8080
      DISCOVERY_UPSTREAM_URL: http://fluxer_caddy:8088/api/.well-known/fluxer
      PUBLIC_BOOTSTRAP_API_ENDPOINT: /api
      PUBLIC_BOOTSTRAP_API_PUBLIC_ENDPOINT: https://fluxer.chenn.dev/api
    depends_on:
      fluxer_api: *healthy
      fluxer_caddy: *started
      fluxer_db: *healthy

  fluxer_snowflakes:
    image: ghcr.io/fluxerapp/fluxer-snowflakes:v1
    container_name: fluxer_snowflakes
    <<: *fluxer_common
    environment:
      <<: *fluxer_env
      FLUXER_SVC_MODE: router
    depends_on:
      fluxer_nats: *started

  fluxer_snowflakes-shard:
    image: ghcr.io/fluxerapp/fluxer-snowflakes:v1
    container_name: fluxer_snowflakes-shard
    <<: *fluxer_common
    environment:
      <<: *fluxer_env
      FLUXER_SVC_MODE: shard
      FLUXER_SVC_SHARD_ID: 0
    depends_on:
      fluxer_nats: *started

  fluxer_users:
    image: ghcr.io/fluxerapp/fluxer-users:v1
    container_name: fluxer_users
    <<: *fluxer_common
    environment:
      <<: *fluxer_env
      FLUXER_SVC_MODE: router
    depends_on:
      fluxer_nats: *started

  fluxer_users-shard:
    image: ghcr.io/fluxerapp/fluxer-users:v1
    container_name: fluxer_users-shard
    <<: *fluxer_common
    environment:
      <<: *fluxer_env
      FLUXER_SVC_MODE: shard
      FLUXER_SVC_SHARD_ID: 0
    depends_on:
      fluxer_nats: *started
      fluxer_db: *healthy

  fluxer_gifs:
    image: ghcr.io/fluxerapp/fluxer-gifs:v1
    container_name: fluxer_gifs
    <<: *fluxer_common
    environment:
      <<: *fluxer_env
      FLUXER_SVC_NAME: gifs
      FLUXER_SVC_MODE: router
      FLUXER_MEDIA_PROXY_PUBLIC_ENDPOINT: https://fluxer.chenn.dev/media
    depends_on:
      fluxer_nats: *started

  fluxer_gifs-shard:
    image: ghcr.io/fluxerapp/fluxer-gifs:v1
    container_name: fluxer_gifs-shard
    <<: *fluxer_common
    environment:
      <<: *fluxer_env
      FLUXER_SVC_NAME: gifs
      FLUXER_SVC_MODE: shard
      FLUXER_SVC_SHARD_ID: 0
      FLUXER_MEDIA_PROXY_PUBLIC_ENDPOINT: https://fluxer.chenn.dev/media
    depends_on:
      fluxer_nats: *started

  fluxer_messages:
    image: ghcr.io/fluxerapp/fluxer-messages:v1
    container_name: fluxer_messages
    <<: *fluxer_common
    environment:
      <<: *fluxer_env
      FLUXER_SVC_MODE: router
    depends_on:
      fluxer_nats: *started

  fluxer_messages-shard:
    image: ghcr.io/fluxerapp/fluxer-messages:v1
    container_name: fluxer_messages-shard
    <<: *fluxer_common
    environment:
      <<: *fluxer_env
      FLUXER_SVC_MODE: shard
      FLUXER_SVC_SHARD_ID: 0
    depends_on:
      fluxer_nats: *started
      fluxer_db: *healthy

  fluxer_unfurl:
    image: ghcr.io/fluxerapp/fluxer-unfurl:v1
    container_name: fluxer_unfurl
    <<: *fluxer_common
    environment:
      <<: *fluxer_env
      FLUXER_SVC_MODE: router
    depends_on:
      fluxer_nats: *started

  fluxer_unfurl-shard:
    image: ghcr.io/fluxerapp/fluxer-unfurl:v1
    container_name: fluxer_unfurl-shard
    <<: *fluxer_common
    environment:
      <<: *fluxer_env
      FLUXER_SVC_MODE: shard
      FLUXER_SVC_SHARD_ID: 0
    depends_on:
      fluxer_nats: *started

  fluxer_admin:
    image: ghcr.io/fluxerapp/fluxer-admin:v1
    container_name: fluxer_admin
    <<: *fluxer_common
    environment:
      <<: *fluxer_env
      FLUXER_ADMIN_HOST: 0.0.0.0
      FLUXER_ADMIN_PORT: 8080
      FLUXER_ADMIN_BASE_PATH: /admin
      FLUXER_API_ENDPOINT: http://fluxer_api:8080
      FLUXER_ADMIN_ENDPOINT: https://fluxer.chenn.dev/admin
