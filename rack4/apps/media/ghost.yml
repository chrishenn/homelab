---
# smtp configuration doesn't work - doesn't respect the mail__from field
# solution: the "support email address" is what sends sign-in links. Admin page: (https://ghost.chenn.dev/ghost)
# admin page -> settings -> membership -> signup portal -> customize -> account page -> support email address
services:
  ghost:
    profiles: [ghost]
    image: ghost:alpine
    container_name: ghost
    restart: unless-stopped
    environment:
      TZ: $TZ
      NODE_ENV: production
      url: https://ghost.chenn.dev
      admin__url:
      privacy__useTinfoil: true

      database__client: mysql
      database__connection__host: ghost_db
      database__connection__user: root
      database__connection__password: ghost
      database__connection__database: ghost

      mail__transport: SMTP
      mail__from: ${SMTP_USER}
      mail__options__service: custom
      mail__options__host: ${SMTP_HOST}
      mail__options__port: 465
      mail__options__secure: true
      mail__options__auth__user: ${SMTP_USER}
      mail__options__auth__pass: ${SMTP_PASS}
    volumes:
      - $DATA/ghost/data:/var/lib/ghost/content
    networks: [ghost, newt]
    labels:
      homepage.group: General Media
      homepage.name: Ghost
      homepage.icon: ghost.png
      homepage.href: https://ghost.chenn.dev
      homepage.description: Blog

      pangolin.public-resources.ghost.name: ghost
      pangolin.public-resources.ghost.full-domain: ghost.chenn.dev
      pangolin.public-resources.ghost.mode: http
      pangolin.public-resources.ghost.targets[0].method: http
      pangolin.public-resources.ghost.targets[0].port: 2368
      pangolin.public-resources.ghost.policy: member

  ghost_db:
    profiles: [ghost]
    image: mysql:8.4.11
    container_name: ghost_db
    restart: unless-stopped
    command: --innodb-buffer-pool-size=1G --innodb-log-buffer-size=500M --innodb-change-buffer-max-size=50 --innodb-flush-log-at-trx_commit=0 --innodb-flush-method=O_DIRECT --log-error-verbosity=1
    environment:
      MYSQL_ROOT_PASSWORD: ghost
      MYSQL_DATABASE: ghost
      MYSQL_USER: ghost
      MYSQL_PASSWORD: ghost
    volumes:
      - $DATA/ghost/db:/var/lib/mysql
    healthcheck:
      test: mysqladmin -h 'localhost' -u root -p ghost -s ping
      interval: 2s
      retries: 120
      timeout: 5s
    networks: [ghost]

networks:
  ghost:
