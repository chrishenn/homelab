---
services:
  bookorbit:
    profiles: [bookorbit]
    image: ghcr.io/bookorbit/bookorbit:latest
    container_name: bookorbit
    restart: unless-stopped
    init: true
    tmpfs: [/tmp]
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://bookorbit:bookorbit@bookorbit_db:5432/bookorbit
      JWT_SECRET: ${BOOKORBIT_SECRET}
      SETUP_BOOTSTRAP_TOKEN: ${BOOKORBIT_BOOT}
      APP_URL: https://bookorbit.chenn.dev
      PUID: ${PUID}
      PGID: ${PGID}
      NODE_MAX_OLD_SPACE_SIZE: 2048
    volumes:
      - $MEDIA/books:/Books
      - $DATA/bookorbit/data:/data
    healthcheck:
      test: [CMD, node, -e, const p=process.env.PORT||3000;fetch('http://127.0.0.1:'+p+'/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [bookorbit, newt]
    labels:
      homepage.group: Books
      homepage.name: Bookorbit
      homepage.icon: bookorbit.png
      homepage.href: https://bookorbit.chenn.dev
      homepage.description: Book Server

      pangolin.public-resources.bookorbit.name: bookorbit
      pangolin.public-resources.bookorbit.full-domain: bookorbit.chenn.dev
      pangolin.public-resources.bookorbit.mode: http
      pangolin.public-resources.bookorbit.targets[0].method: http
      pangolin.public-resources.bookorbit.targets[0].port: 3000
      pangolin.public-resources.bookorbit.policy: member

  bookorbit_db:
    profiles: [bookorbit]
    image: pgvector/pgvector:pg18
    container_name: bookorbit_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bookorbit
      POSTGRES_PASSWORD: bookorbit
      POSTGRES_DB: bookorbit
    volumes:
      - $DATA/bookorbit/db:/var/lib/postgresql
    healthcheck:
      test: pg_isready -q -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [bookorbit]

networks:
  bookorbit:
