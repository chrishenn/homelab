---
services:
  audiobookshelf:
    profiles: [audiobookshelf]
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    restart: unless-stopped
    environment:
      TZ: $TZ
    volumes:
      - $MEDIA/Books:/media
      - $DATA/audiobookshelf/config:/config
      - $DATA/audiobookshelf/metadata:/metadata
    networks: [newt, arr]
    labels:
      homepage.group: Books
      homepage.name: Audio Bookshelf
      homepage.icon: https://icons.chenn.dev/audiobookshelf.svg
      homepage.href: https://audiobookshelf.chenn.dev
      homepage.description: Audiobook Server

      pangolin.public-resources.audiobookshelf.name: audiobookshelf
      pangolin.public-resources.audiobookshelf.full-domain: audiobookshelf.chenn.dev
      pangolin.public-resources.audiobookshelf.mode: http
      pangolin.public-resources.audiobookshelf.targets[0].method: http
      pangolin.public-resources.audiobookshelf.targets[0].port: 80
      pangolin.public-resources.audiobookshelf.policy: member

      pangolin.public-resources.audiobookshelf.rules[0].action: allow
      pangolin.public-resources.audiobookshelf.rules[0].match: path
      pangolin.public-resources.audiobookshelf.rules[0].value: /api/*
      pangolin.public-resources.audiobookshelf.rules[1].action: allow
      pangolin.public-resources.audiobookshelf.rules[1].match: path
      pangolin.public-resources.audiobookshelf.rules[1].value: /login
      pangolin.public-resources.audiobookshelf.rules[2].action: allow
      pangolin.public-resources.audiobookshelf.rules[2].match: path
      pangolin.public-resources.audiobookshelf.rules[2].value: /auth/*
      pangolin.public-resources.audiobookshelf.rules[3].action: allow
      pangolin.public-resources.audiobookshelf.rules[3].match: path
      pangolin.public-resources.audiobookshelf.rules[3].value: /feed/*
      pangolin.public-resources.audiobookshelf.rules[4].action: allow
      pangolin.public-resources.audiobookshelf.rules[4].match: path
      pangolin.public-resources.audiobookshelf.rules[4].value: /socket.io/
      pangolin.public-resources.audiobookshelf.rules[5].action: allow
      pangolin.public-resources.audiobookshelf.rules[5].match: path
      pangolin.public-resources.audiobookshelf.rules[5].value: /status
      pangolin.public-resources.audiobookshelf.rules[6].action: allow
      pangolin.public-resources.audiobookshelf.rules[6].match: path
      pangolin.public-resources.audiobookshelf.rules[6].value: /logout
      pangolin.public-resources.audiobookshelf.rules[7].action: allow
      pangolin.public-resources.audiobookshelf.rules[7].match: path
      pangolin.public-resources.audiobookshelf.rules[7].value: /ping
      pangolin.public-resources.audiobookshelf.rules[8].action: allow
      pangolin.public-resources.audiobookshelf.rules[8].match: path
      pangolin.public-resources.audiobookshelf.rules[8].value: /public/*
