---
services:
  stirling:
    profiles: [stirling]
    image: stirlingtools/stirling-pdf:latest-fat
    container_name: stirling
    restart: unless-stopped
    environment:
      SYSTEM_CORSALLOWEDORIGINS: https://stirling.chenn.dev
      SECURITY_ENABLELOGIN: true
      MODE: BOTH
      LANGS: en_GB
      DISABLE_ADDITIONAL_FEATURES: false
      UI_LOGOSTYLE: modern
      METRICS_ENABLED: true

      SECURITY_INITIALLOGIN_USERNAME: ${USER}
      SECURITY_INITIALLOGIN_PASSWORD: ${PASS}

      MAIL_ENABLED: true
      MAIL_ENABLEINVITES: true
      MAIL_HOST: ${SMTP_HOST}
      MAIL_PORT: ${SMTP_PORT}
      MAIL_USERNAME: ${SMTP_USER}
      MAIL_PASSWORD: ${SMTP_PASS}
      MAIL_FROM: ${SMTP_USER}
      MAIL_TLS_ENABLED: true

      SECURITY_OAUTH2_ENABLED: true
      SECURITY_OAUTH2_AUTOCREATEUSER: true
      SECURITY_OAUTH2_BLOCKREGISTRATION: false
      SECURITY_OAUTH2_PROVIDER: PocketID
      SECURITY_OAUTH2_ISSUER: https://pocketid.chenn.dev
      SECURITY_OAUTH2_CLIENTID: ${STIRLING_OIDC_CLIENT}
      SECURITY_OAUTH2_CLIENTSECRET: ${STIRLING_OIDC_SECRET}
      SECURITY_OAUTH2_SCOPES: openid,profile,email
      SECURITY_OAUTH2_USEASUSERNAME: email
    volumes:
      - $DATA/stirling/tessdata:/usr/share/tessdata
      - $DATA/stirling/configs:/configs
      - $DATA/stirling/logs:/logs
      - $DATA/stirling/customFiles:/customFiles:rw
      - $DATA/stirling/pipeline:/pipeline
    healthcheck:
      test: [CMD, curl, -ILfSs, http://localhost:8080/api/v1/info/status]
    networks: [newt]
    labels:
      homepage.group: PDF Tools
      homepage.name: Stirling PDF
      homepage.icon: https://icons.chenn.dev/stirling-pdf.svg
      homepage.href: https://stirling.chenn.dev
      homepage.description: PDF Editing

      pangolin.public-resources.stirling.name: stirling
      pangolin.public-resources.stirling.full-domain: stirling.chenn.dev
      pangolin.public-resources.stirling.mode: http
      pangolin.public-resources.stirling.targets[0].method: http
      pangolin.public-resources.stirling.targets[0].port: 8080
      pangolin.public-resources.stirling.policy: member
