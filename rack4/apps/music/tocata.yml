# sudo chown -R 1000:1000 $DATA/tocata/data
---
services:
  tocata:
    profiles: [tocata]
    image: ghcr.io/ogarcia/tocata:latest
    container_name: tocata
    restart: unless-stopped
    volumes:
      - $DATA/tocata/data:/data
      - $DATA/tocata/media:/media:ro
    networks: [newt]
    labels:
      homepage.group: Music
      homepage.name: tocata
      homepage.icon: https://icons.chenn.dev/tocata.svg
      homepage.href: https://tocata.chenn.dev
      homepage.description: Music Server

      pangolin.public-resources.tocata.name: tocata
      pangolin.public-resources.tocata.full-domain: tocata.chenn.dev
      pangolin.public-resources.tocata.mode: http
      pangolin.public-resources.tocata.targets[0].method: http
      pangolin.public-resources.tocata.targets[0].port: 4224
      pangolin.public-resources.tocata.policy: tocata

      #      pangolin.public-resources.tocata.auth.mtls.enabled: true
      #      pangolin.public-resources.tocata.auth.mtls.ca-certificates[0]: |
      #        ${MTLS_CA_CERT}

      pangolin.public-resources.tocata.rules[0].action: allow
      pangolin.public-resources.tocata.rules[0].match: path
      pangolin.public-resources.tocata.rules[0].value: /api/*

      pangolin.public-resources.tocata.rules[1].action: allow
      pangolin.public-resources.tocata.rules[1].match: path
      pangolin.public-resources.tocata.rules[1].value: /rest/*
