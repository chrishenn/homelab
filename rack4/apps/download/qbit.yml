# user: admin
# pass: cat $DATA/qbit2/config/supervisord.log | grep -i 'temporary password' | tail -n 1

# in the web ui:
# - change user, pass
# - change download location
---
configs:
  qbit:
    content: |
      ${PROTONVPN_WG0}

services:
  qbit:
    profiles: [qbit]
    image: binhex/arch-qbittorrentvpn:latest
    container_name: qbit
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    privileged: true
    sysctls:
      net.ipv4.conf.all.src_valid_mark: 1
    environment:
      TZ: $TZ
      PUID: $PUID
      PGID: $PGID
      VPN_ENABLED: yes
      # tricks startup script into enabling port forwarding, even though protonvpn creds are in wg0.conf
      VPN_USER: +pmp
      VPN_PROV: protonvpn
      VPN_CLIENT: wireguard
      ENABLE_STARTUP_SCRIPTS: no
      ENABLE_PRIVOXY: no
      STRICT_PORT_FORWARD: yes
      USERSPACE_WIREGUARD: no
      ENABLE_SOCKS: no
      LAN_NETWORK: 192.168.1.0/24
      NAME_SERVERS: 1.1.1.1,1.0.0.1
      DEBUG: false
    configs:
      - source: qbit
        target: /config/wireguard/wg0.conf
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - $DATA/qbit/data:/data
      - $DATA/qbit/config:/config
      - $DATA/qbit/downloads:/qbit/downloads
    ports:
      - '8118:8118'
      - '9118:9118'
      - '58946:58946'
      - '58946:58946/udp'
    networks: [newt, scry]
    labels:
      homepage.group: Download
      homepage.name: Qbittorrent (VPN)
      homepage.icon: https://icons.chenn.dev/qbittorrent.svg
      homepage.href: https://qbit.chenn.dev
      homepage.description: VPN Torrents

      pangolin.public-resources.qbit.name: qbit
      pangolin.public-resources.qbit.full-domain: qbit.chenn.dev
      pangolin.public-resources.qbit.mode: http
      pangolin.public-resources.qbit.targets[0].method: http
      pangolin.public-resources.qbit.targets[0].port: 8080
      pangolin.public-resources.qbit.policy: member

networks:
  qbit:
