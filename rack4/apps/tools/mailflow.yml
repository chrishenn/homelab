---
services:
  mailflow_frontend:
    profiles: [mailflow]
    image: ghcr.io/maathimself/mailflow-frontend:latest
    container_name: mailflow_frontend
    restart: unless-stopped
    volumes:
      - $DATA/mailflow/frontend:/etc/nginx/ssl
      - ./mailflow/frontend.conf:/etc/nginx/conf.d/default.conf
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO/dev/null http://127.0.0.1:80/ || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [mailflow, newt]
    labels:
      homepage.group: General Tools
      homepage.name: MailFlow
      homepage.icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/mailflow.png
      homepage.href: https://mailflow.chenn.dev
      homepage.description: Unified Email Inbox

      pangolin.public-resources.mailflow.name: mailflow
      pangolin.public-resources.mailflow.full-domain: mailflow.chenn.dev
      pangolin.public-resources.mailflow.mode: http
      pangolin.public-resources.mailflow.targets[0].method: http
      pangolin.public-resources.mailflow.targets[0].port: 80
      pangolin.public-resources.mailflow.policy: member

  mailflow_backend:
    profiles: [mailflow]
    image: ghcr.io/maathimself/mailflow-backend:latest
    container_name: mailflow_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      SESSION_SECRET: ${MAILFLOW_SESSION}
      APP_URL: https://mailflow.chenn.dev
      FRONTEND_URL: https://mailflow.chenn.dev
      DB_HOST: mailflow_db
      DB_NAME: mailflow
      DB_USER: mailflow
      DB_PASSWORD: mailflow
      REDIS_URL: redis://mailflow_redis:6379
      ENCRYPTION_KEY: ${MAILFLOW_ENCRYPTION}
      VAPID_PUBLIC_KEY: ${MAILFLOW_VAPID_PUB}
      VAPID_PRIVATE_KEY: ${MAILFLOW_VAPID_PRIV}
      VAPID_SUBJECT: https://mailflow.chenn.dev
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [mailflow]

  mailflow_db:
    profiles: [mailflow]
    image: postgres:18-alpine
    container_name: mailflow_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mailflow
      POSTGRES_USER: mailflow
      POSTGRES_PASSWORD: mailflow
    volumes:
      - $DATA/mailflow/db:/var/lib/postgresql
    healthcheck:
      test: pg_isready -q -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [mailflow]

  mailflow_redis:
    profiles: [mailflow]
    image: valkey/valkey:alpine
    container_name: mailflow_redis
    restart: unless-stopped
    command: valkey-server --save 60 1 --loglevel warning
    volumes:
      - $DATA/mailflow/redis:/data
    healthcheck:
      test: valkey-cli ping
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [mailflow]

networks:
  mailflow:
