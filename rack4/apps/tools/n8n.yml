# oidc requires enterprise license
# I think it creates files that it then cannot access. shrug

# start the stack
# sudo chown -R 1000:1000 $DATA/n8n
# bounce the stack
---
x-n8n_env: &n8n_env
  NODE_ENV: production
  N8N_WEBHOOK_URL: https://n8n.chenn.dev
  GENERIC_TIMEZONE: ${TZ}
  EXECUTIONS_MODE: queue
  QUEUE_BULL_REDIS_HOST: n8n_redis
  QUEUE_HEALTH_CHECK_ACTIVE: true
  OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: true

  N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: true
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
  N8N_HOST: n8n.chenn.dev
  N8N_PORT: 5678
  N8N_PROTOCOL: https
  N8N_RUNNERS_MODE: external
  N8N_NATIVE_PYTHON_RUNNER: true
  N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
  N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
  N8N_RUNNERS_AUTH_TOKEN: very_secret_runner_token
  N8N_DIAGNOSTICS_ENABLED: false
  N8N_VERSION_NOTIFICATIONS_ENABLED: false
  N8N_LICENSE_ACTIVATION_KEY: ${N8N_LICENSE}

  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: n8n_db
  DB_POSTGRESDB_PORT: 5432
  DB_POSTGRESDB_DATABASE: n8n
  DB_POSTGRESDB_USER: n8n
  DB_POSTGRESDB_PASSWORD: n8n

services:
  n8n:
    profiles: [n8n]
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    environment:
      <<: *n8n_env
    volumes:
      - $DATA/n8n/n8n_storage:/home/node/.n8n
    networks: [n8n, newt]
    labels:
      homepage.group: General Tools
      homepage.name: N8n
      homepage.icon: n8n.png
      homepage.href: https://n8n.chenn.dev
      homepage.description: GUI Data Flow

      pangolin.public-resources.n8n.name: n8n
      pangolin.public-resources.n8n.full-domain: n8n.chenn.dev
      pangolin.public-resources.n8n.mode: http
      pangolin.public-resources.n8n.targets[0].method: http
      pangolin.public-resources.n8n.targets[0].port: 5678
      pangolin.public-resources.n8n.policy: member

  n8n_worker:
    profiles: [n8n]
    image: n8nio/n8n:latest
    container_name: n8n_worker
    restart: unless-stopped
    command: worker
    environment:
      <<: *n8n_env
    volumes:
      - $DATA/n8n/n8n_storage:/home/node/.n8n
    depends_on:
      - n8n
    networks: [n8n]

  n8n_db:
    profiles: [n8n]
    image: postgres:18-alpine
    container_name: n8n_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: n8n
    volumes:
      - $DATA/n8n/db:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U root -d n8n']
    networks: [n8n]

  n8n_redis:
    profiles: [n8n]
    image: valkey/valkey:alpine
    container_name: n8n_redis
    restart: unless-stopped
    volumes:
      - $DATA/n8n/redis:/data
    healthcheck:
      test: redis-cli ping
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [n8n]

networks:
  n8n:
