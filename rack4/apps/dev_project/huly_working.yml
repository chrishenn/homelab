# sudo rm -rf $DATA/huly
# mkdir -p $DATA/huly/redpanda $DATA/huly/elastic
# sudo chown -R 101:101 $DATA/huly/redpanda
# sudo chown -R 1000:1000 $DATA/huly/elastic
---
configs:
  huly_s3:
    content: |
      metadata_dir = "/var/lib/garage/meta"
      data_dir = "/var/lib/garage/data"
      db_engine = "sqlite"
      replication_factor = 1

      rpc_bind_addr = "[::]:3901"
      rpc_public_addr = "127.0.0.1:3901"
      rpc_secret = "3edbcd68eab32e34ec932062ed499f0dd828eda5eec3b3643f7ca03146f7701b"

      [s3_api]
      s3_region = "huly"
      api_bind_addr = "[::]:9000"
      root_domain = ".s3.garage.localhost"

  huly_nginx:
    content: |
      server {
          listen 80;
          server_name _;
          client_max_body_size 100M;
      
          location / {
              proxy_set_header Host $$host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;
              proxy_pass http://huly_front:8080;
          }      
          location /_accounts {
              proxy_set_header Host $$host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;
      
              rewrite ^/_accounts(/.*)$$ $$1 break;
              proxy_pass http://huly_account:3000/;
          }      
          location /_collaborator {
              proxy_set_header Host $$host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;
      
              proxy_http_version 1.1;
              proxy_set_header Upgrade $$http_upgrade;
              proxy_set_header Connection "upgrade";
              rewrite ^/_collaborator(/.*)$$ $$1 break;
              proxy_pass http://huly_collaborator:3078/;
          }      
          location /_transactor {
              proxy_set_header Host $$host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;
              
              proxy_http_version 1.1;
              proxy_set_header Upgrade $$http_upgrade;
              proxy_set_header Connection "upgrade";
              rewrite ^/_transactor(/.*)$$ $$1 break;
              proxy_pass http://huly_transactor:3333/;
          }      
          location ~ ^/eyJ {
              proxy_set_header Host $$host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;
              
              proxy_http_version 1.1;
              proxy_set_header Upgrade $$http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_pass http://huly_transactor:3333;
          }      
          location /_rekoni {
              proxy_set_header Host $$host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;
      
              rewrite ^/_rekoni(/.*)$$ $$1 break;
              proxy_pass http://huly_rekoni:4004/;
          }      
          location /_stats {
              proxy_set_header Host $$host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;
      
              rewrite ^/_stats(/.*)$$ $$1 break;
              proxy_pass http://huly_stats:4900/;
          }
      }

x-huly_cmn: &huly_cmn
  profiles: [huly]
  restart: unless-stopped
  networks: [huly]

services:
  huly:
    <<: *huly_cmn
    image: nginx:1.21.3
    configs:
      - source: huly_nginx
        target: /etc/nginx/conf.d/default.conf
    networks: [huly, newt]
    labels:
      homepage.group: Project Management
      homepage.name: huly
      homepage.icon: huly.png
      homepage.href: https://huly.chenn.dev
      homepage.description: huly

      pangolin.public-resources.huly.name: huly
      pangolin.public-resources.huly.full-domain: huly.chenn.dev
      pangolin.public-resources.huly.mode: http
      pangolin.public-resources.huly.targets[0].method: http
      pangolin.public-resources.huly.targets[0].port: 80
      pangolin.public-resources.huly.policy: member

  huly_cockroach:
    <<: *huly_cmn
    image: cockroachdb/cockroach:latest-v24.2
    command: start-single-node --accept-sql-without-tls
    environment:
      COCKROACH_DATABASE: huly
      COCKROACH_USER: huly
      COCKROACH_PASSWORD: huly
    volumes:
      - $DATA/huly/cockroach/data:/cockroach/cockroach-data
      - $DATA/huly/cockroach/certs:/cockroach/certs

  huly_redpanda:
    <<: *huly_cmn
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.6
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://huly_redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://huly_redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr huly_redpanda:33145
      - --advertise-rpc-addr huly_redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
    volumes:
      - $DATA/huly/redpanda:/var/lib/redpanda/data
    environment:
      REDPANDA_SUPERUSER_USERNAME: huly
      REDPANDA_SUPERUSER_PASSWORD: huly
    healthcheck:
      test: rpk cluster info -X user=huly -X pass=huly
      interval: 10s
      timeout: 5s
      retries: 10
  
  huly-s3:
    profiles: [huly]
    image: dxflrs/garage:v2.3.0
    container_name: huly-s3
    restart: unless-stopped
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: hulyhuly
      GARAGE_DEFAULT_SECRET_KEY: 09af8a1c44b49b9f3cd73a148402aef1bed12f58646f8b2e0cc022d8a4ca8e1d
      GARAGE_DEFAULT_BUCKET: huly
    configs:
      - source: huly_s3
        target: /etc/garage.toml
    volumes:
      - $DATA/huly/s3/data:/var/lib/garage/data
      - $DATA/huly/s3/meta:/var/lib/garage/meta
    command: /garage server --single-node --default-bucket
    networks: [huly]

  huly_elastic:
    <<: *huly_cmn
    image: elasticsearch:7.14.2
    command: |
      /bin/sh -c "./bin/elasticsearch-plugin list | grep -q ingest-attachment || yes | ./bin/elasticsearch-plugin install --silent ingest-attachment;
      /usr/local/bin/docker-entrypoint.sh eswrapper"
    volumes:
      - $DATA/huly/elastic:/usr/share/elasticsearch/data
    environment:
      - ELASTICSEARCH_PORT_NUMBER=9200
      - BITNAMI_DEBUG=true
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1024m -Xmx1024m
      - http.cors.enabled=true
      - http.cors.allow-origin=http://localhost:8082
    healthcheck:
      interval: 20s
      retries: 10
      test: curl -s http://localhost:9200/_cluster/health | grep -vq '"status":"red"'
    
  huly_rekoni:
    <<: *huly_cmn
    image: hardcoreeng/rekoni-service:v0.7.426
    environment:
      - SECRET=68fa2c555a8d79d501b968e9b80758e26cd8cba09bf16fe2fabd0ac7154de92b
    deploy:
      resources:
        limits:
          memory: 500M

  huly_transactor:
    <<: *huly_cmn
    image: hardcoreeng/transactor:v0.7.426
    environment:
      - SERVER_PORT=3333
      - SERVER_SECRET=68fa2c555a8d79d501b968e9b80758e26cd8cba09bf16fe2fabd0ac7154de92b
      - DB_URL=postgres://huly:huly@huly_cockroach:26257/huly
      - STORAGE_CONFIG=minio|huly-s3:9000?accessKey=hulyhuly&secretKey=09af8a1c44b49b9f3cd73a148402aef1bed12f58646f8b2e0cc022d8a4ca8e1d&region=huly
      - FRONT_URL=http://localhost:8087
      - ACCOUNTS_URL=http://huly_account:3000
      - FULLTEXT_URL=http://huly_fulltext:4700
      - STATS_URL=http://huly_stats:4900
      - LAST_NAME_FIRST=true
      - QUEUE_CONFIG=huly_redpanda:9092

  huly_collaborator:
    <<: *huly_cmn
    image: hardcoreeng/collaborator:v0.7.426
    environment:
      - COLLABORATOR_PORT=3078
      - SECRET=68fa2c555a8d79d501b968e9b80758e26cd8cba09bf16fe2fabd0ac7154de92b
      - ACCOUNTS_URL=http://huly_account:3000
      - STATS_URL=http://huly_stats:4900
      - STORAGE_CONFIG=minio|huly-s3:9000?accessKey=hulyhuly&secretKey=09af8a1c44b49b9f3cd73a148402aef1bed12f58646f8b2e0cc022d8a4ca8e1d&region=huly

  huly_account:
    <<: *huly_cmn
    image: hardcoreeng/account:v0.7.426
    environment:
      - SERVER_PORT=3000
      - SERVER_SECRET=68fa2c555a8d79d501b968e9b80758e26cd8cba09bf16fe2fabd0ac7154de92b
      - DB_URL=postgres://huly:huly@huly_cockroach:26257/huly
      - TRANSACTOR_URL=ws://huly_transactor:3333;wss://huly.chenn.dev/_transactor
      - STORAGE_CONFIG=minio|huly-s3:9000?accessKey=hulyhuly&secretKey=09af8a1c44b49b9f3cd73a148402aef1bed12f58646f8b2e0cc022d8a4ca8e1d&region=huly
      - FRONT_URL=https://huly.chenn.dev
      - STATS_URL=https://huly.chenn.dev/_stats
      - MODEL_ENABLED=*
      - ACCOUNTS_URL=https://huly.chenn.dev/_accounts
      - ACCOUNT_PORT=3000
      - QUEUE_CONFIG=huly_redpanda:9092

  huly_workspace:
    <<: *huly_cmn
    image: hardcoreeng/workspace:v0.7.426
    environment:
      - SERVER_SECRET=68fa2c555a8d79d501b968e9b80758e26cd8cba09bf16fe2fabd0ac7154de92b
      - DB_URL=postgres://huly:huly@huly_cockroach:26257/huly
      - TRANSACTOR_URL=ws://huly_transactor:3333;wss://huly.chenn.dev/_transactor
      - STORAGE_CONFIG=minio|huly-s3:9000?accessKey=hulyhuly&secretKey=09af8a1c44b49b9f3cd73a148402aef1bed12f58646f8b2e0cc022d8a4ca8e1d&region=huly
      - MODEL_ENABLED=*
      - ACCOUNTS_URL=http://huly_account:3000
      - STATS_URL=http://huly_stats:4900
      - QUEUE_CONFIG=huly_redpanda:9092
      - ACCOUNTS_DB_URL=postgres://huly:huly@huly_cockroach:26257/huly

  huly_front:
    <<: *huly_cmn
    image: hardcoreeng/front:v0.7.426
    environment:
      - SERVER_PORT=8080
      - SERVER_SECRET=68fa2c555a8d79d501b968e9b80758e26cd8cba09bf16fe2fabd0ac7154de92b
      - LOVE_ENDPOINT=https://huly.chenn.dev/_love
      - ACCOUNTS_URL=https://huly.chenn.dev/_accounts
      - ACCOUNTS_URL_INTERNAL=http://huly_account:3000
      - REKONI_URL=https://huly.chenn.dev/_rekoni
      - CALENDAR_URL=https://huly.chenn.dev/_calendar
      - GMAIL_URL=https://huly.chenn.dev/_gmail
      - TELEGRAM_URL=https://huly.chenn.dev/_telegram
      - STATS_URL=https://huly.chenn.dev/_stats
      - UPLOAD_URL=/files
      - ELASTIC_URL=http://huly_elastic:9200
      - COLLABORATOR_URL=wss://huly.chenn.dev/_collaborator
      - STORAGE_CONFIG=minio|huly-s3:9000?accessKey=hulyhuly&secretKey=09af8a1c44b49b9f3cd73a148402aef1bed12f58646f8b2e0cc022d8a4ca8e1d&region=huly
      - TITLE='Chicken Huly'
      - DEFAULT_LANGUAGE=en
      - LAST_NAME_FIRST=true
      - DESKTOP_UPDATES_CHANNEL=0.7.426
      - DISABLED_FEATURES=auto-translate,mailboxes

  huly_fulltext:
    <<: *huly_cmn
    image: hardcoreeng/fulltext:v0.7.426
    environment:
      - SERVER_SECRET=68fa2c555a8d79d501b968e9b80758e26cd8cba09bf16fe2fabd0ac7154de92b
      - DB_URL=postgres://huly:huly@huly_cockroach:26257/huly
      - FULLTEXT_DB_URL=http://huly_elastic:9200
      - ELASTIC_INDEX_NAME=huly_storage_index
      - STORAGE_CONFIG=minio|huly-s3:9000?accessKey=hulyhuly&secretKey=09af8a1c44b49b9f3cd73a148402aef1bed12f58646f8b2e0cc022d8a4ca8e1d&region=huly
      - REKONI_URL=http://huly_rekoni:4004
      - ACCOUNTS_URL=http://huly_account:3000
      - STATS_URL=http://huly_stats:4900
      - QUEUE_CONFIG=huly_redpanda:9092

  huly_stats:
    <<: *huly_cmn
    image: hardcoreeng/stats:v0.7.426
    environment:
      PORT: 4900
      SERVER_SECRET: 68fa2c555a8d79d501b968e9b80758e26cd8cba09bf16fe2fabd0ac7154de92b

  huly_kvs:
    <<: *huly_cmn
    image: hardcoreeng/hulykvs:v0.7.426
    environment:
      HULY_DB_CONNECTION: postgres://huly:huly@huly_cockroach:26257/huly
      HULY_TOKEN_SECRET: 68fa2c555a8d79d501b968e9b80758e26cd8cba09bf16fe2fabd0ac7154de92b

networks: {huly}