# Very cool, but very cpu heavy! Like %1 of 32 cores at idle
---
configs:
  netdata:
    content: |
      :80 {
        reverse_proxy host.docker.internal:19999
      }

services:
  netdata_caddy:
    profiles: [netdata]
    image: caddy:alpine
    container_name: netdata_caddy
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    configs:
      - source: netdata
        target: /etc/caddy/Caddyfile
    volumes:
      - $DATA/netdata/caddy_data:/data
      - $DATA/netdata/caddy_config:/config
    networks: [newt]
    labels:
      homepage.group: Infra
      homepage.name: Netdata
      homepage.icon: https://icons.chenn.dev/netdata.svg
      homepage.href: https://netdata.chenn.dev
      homepage.description: Realtime Monitoring

      pangolin.public-resources.netdata.name: netdata
      pangolin.public-resources.netdata.full-domain: netdata.chenn.dev
      pangolin.public-resources.netdata.mode: http
      pangolin.public-resources.netdata.targets[0].method: http
      pangolin.public-resources.netdata.targets[0].port: 80
      pangolin.public-resources.netdata.policy: chris

  netdata:
    profiles: [netdata]
    image: netdata/netdata:latest
    container_name: netdata
    restart: unless-stopped
    pid: host
    network_mode: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    environment:
      DISABLE_TELEMETRY: 1
    volumes:
      - $DATA/netdata/data:/etc/netdata
      - $DATA/netdata/lib:/var/lib/netdata
      - $DATA/netdata/cache:/var/cache/netdata
      - /:/host/root:ro,rslave
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /etc/localtime:/etc/localtime:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/log:/host/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/dbus:/run/dbus:ro
