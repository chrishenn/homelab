---
x-lancache_env: &lancache_env
  USE_GENERIC_CACHE: true
  LANCACHE_IP: ${LANCACHE_IP}
  DNS_BIND_IP: ${LANCACHE_DNS}

  UPSTREAM_DNS: ${DNS_VIP}
  CACHE_DISK_SIZE: 1000g
  CACHE_INDEX_SIZE: 500m
  TZ: ${TZ}

  #  DISABLE_RIOT: true

services:
  # nslookup lancache.steamcontent.com
  lancache:
    profiles: [lancache]
    image: lancachenet/monolithic:latest
    container_name: lancache
    restart: unless-stopped
    environment:
      <<: *lancache_env
    volumes:
      - $DATA/lancache/cache:/data/cache
      - $DATA/lancache/logs:/data/logs
    ports:
      - '${LANCACHE_IP}:80:80/tcp'
      - '${LANCACHE_IP}:443:443/tcp'

  lancache_dns:
    profiles: [lancache]
    image: lancachenet/lancache-dns:latest
    container_name: lancache_dns
    restart: unless-stopped
    environment:
      <<: *lancache_env
    ports:
      - '${LANCACHE_DNS}:53:53/udp'
      - '${LANCACHE_DNS}:53:53/tcp'

  # dc run --rm -it --entrypoint /bin/bash --workdir /app lancache_prefill
  # dc run --rm -it lancache_prefill select-apps
  # dc run --rm -it lancache_prefill prefill
  lancache_prefill:
    profiles: [lancache]
    image: tpill90/steam-lancache-prefill:latest
    container_name: lancache_prefill
    restart: no
    network_mode: host
    volumes:
      - $DATA/lancache/prefill:/Config

  # dc exec lancache_manager cat /data/security/api_key.txt
  # initial login api key is also in the docker log
  lancache_manager:
    profiles: [lancache]
    image: ghcr.io/regix1/lancache-manager:latest
    container_name: lancache_manager
    restart: unless-stopped
    volumes:
      - $DATA/lancache_manager/data:/data
      - $DATA/lancache/cache:/cache
      - $DATA/lancache/logs:/logs
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      PUID: 0
      PGID: 0
      TZ: $TZ
      LanCache__LogPath: /logs/access.log
      LanCache__CachePath: /cache/cache
      Prefill__NetworkMode: host
      Prefill__LancacheIp: ${LANCACHE_IP}
      Prefill__LancacheDnsIp: ${LANCACHE_DNS}
      Optimizations__EnableGarbageCollectionManagement: true
    networks: [newt]
    labels:
      homepage.group: Infra
      homepage.name: Lancache Manager
      homepage.icon: lancache.png
      homepage.href: https://lancache.chenn.dev
      homepage.description: Lancache Manager GUI

      pangolin.public-resources.lancache.name: lancache
      pangolin.public-resources.lancache.full-domain: lancache.chenn.dev
      pangolin.public-resources.lancache.mode: http
      pangolin.public-resources.lancache.targets[0].method: http
      pangolin.public-resources.lancache.targets[0].port: 80
      pangolin.public-resources.lancache.policy: member
