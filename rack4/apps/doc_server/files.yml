# sudo chown -R 1000:1000 $DATA/files
---
configs:
  files:
    content: |
      frontend:
        name: 'Quantum Chicken'
        description: A file server for the Dancing Chicken
        oidcLoginButtonText: Pocket ID

      http:
        externalUrl: https://files.chenn.dev
        internalUrl: http://files:80
        trustProxyHeaders: true
        disableWebDAV: true

      server:
        sources:
          - path: /mnt/f/
            name: f
            config:
              defaultEnabled: true
              defaultUserScope: "/"
              defaultPermissions:
                view: true
                modify: true
                create: true
                delete: true
                download: true
          - path: /mnt/h/
            name: h
            config:
              defaultEnabled: true
              defaultUserScope: "/"
              defaultPermissions:
                view: true
                modify: true
                create: true
                delete: true
                download: true
          - path: /mnt/k/
            name: k
            config:
              defaultEnabled: true
              defaultUserScope: "/"
              defaultPermissions:
                view: true
                modify: true
                create: true
                delete: true
                download: true
          - path: /mnt/r/
            name: r
            config:
              defaultEnabled: true
              defaultUserScope: "/"
              defaultPermissions:
                view: true
                modify: true
                create: true
                delete: true
                download: true

      auth:
        adminUsername: chris
        methods:
          password:
            enabled: false
          oidc:
            enabled: true
            issuerUrl: https://pocketid.chenn.dev
            scopes: email openid profile groups
            userIdentifier: preferred_username
            groupsClaim: groups
            adminGroup: admin
            createUser: true

      userDefaults:
        account:
          loginMethod: oidc
          disableUpdateNotifications: true
          permissions:
            admin: false
            api: true
            share: true
            realtime: true
        listing:
          deleteWithoutConfirming: true
          showHidden: true
          quickDownload: true
          viewMode: "compact"

services:
  files:
    profiles: [files]
    image: gtstef/filebrowser:stable
    container_name: files
    restart: unless-stopped
    user: root
    configs:
      - source: files
        target: /config.yaml
    environment:
      FILEBROWSER_CONFIG: /config.yaml
      FILEBROWSER_ADMIN_PASSWORD: ${FILES_PASS}
      FILEBROWSER_OIDC_CLIENT_ID: ${FILES_OIDC_CLIENT}
      FILEBROWSER_OIDC_CLIENT_SECRET: ${FILES_OIDC_SECRET}
    volumes:
      - $DATA/files/data:/home/filebrowser/data
      - /mnt/f:/mnt/f
      - /mnt/h:/mnt/h
      - /mnt/k:/mnt/k
      - /mnt/r:/mnt/r
    networks: [newt]
    labels:
      homepage.group: File Servers
      homepage.name: Filebrowser Quantum
      homepage.icon: https://icons.chenn.dev/filebrowser-quantum.svg
      homepage.href: https://files.chenn.dev
      homepage.description: File Server

      pangolin.public-resources.files.name: files
      pangolin.public-resources.files.full-domain: files.chenn.dev
      pangolin.public-resources.files.mode: http
      pangolin.public-resources.files.targets[0].method: http
      pangolin.public-resources.files.targets[0].port: 80
      pangolin.public-resources.files.policy: chris
