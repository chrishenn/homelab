# fosrl rolled their own template substitution for with a quick-n-dirty find-replace. So ... yeah
# if you put the speshal chars in a comment, for example, explaining the issue, for example ... your bp will fail SILENTLY
# I'm losing my mind

public-policies:
  member:
    name: Default Member Policy
    sso: true
    sso-roles:
      - Member
    apply-rules: true
    rules:
      - action: pass
        match: country
        value: US
      - action: deny
        match: country
        value: ALL

  chris:
    name: Chris Only
    sso: true
    sso-users:
      - '{{env.EMAIL}}'
    apply-rules: true
    rules:
      - action: pass
        match: country
        value: US
      - action: deny
        match: country
        value: ALL

  arr:
    name: Arr Basic Auth
    sso: true
    sso-roles:
      - Member
    basic-auth:
      user: '{{env.ARR_PANGOLIN_AUTH_USER}}'
      password: '{{env.ARR_PANGOLIN_AUTH_PASS}}'
      extended-compatibility: true
    apply-rules: true
    rules:
      - action: pass
        match: country
        value: US
      - action: deny
        match: country
        value: ALL

  immich:
    name: Immich Basic Auth
    sso: true
    sso-roles:
      - Member
    basic-auth:
      user: '{{env.IMMICH_PANGOLIN_AUTH_USER}}'
      password: '{{env.IMMICH_PANGOLIN_AUTH_PASS}}'
      extended-compatibility: true
    apply-rules: true
    rules:
      - action: pass
        match: country
        value: US
      - action: deny
        match: country
        value: ALL

  us:
    name: US Only
    sso: false
    apply-rules: true
    rules:
      - action: pass
        match: country
        value: US
      - action: deny
        match: country
        value: ALL

  canam:
    name: US and Canada Only
    sso: false
    apply-rules: true
    rules:
      - action: pass
        match: country
        value: US
      - action: pass
        match: country
        value: CA
      - action: deny
        match: country
        value: ALL

  subsonic:
    name: Member SSO, Basic Auth, mTLS
    sso: true
    sso-roles:
      - Member
    basic-auth:
      user: '{{env.ARR_PANGOLIN_AUTH_USER}}'
      password: '{{env.ARR_PANGOLIN_AUTH_PASS}}'
      extended-compatibility: true
    apply-rules: true
    rules:
      - action: pass
        match: country
        value: US
      - action: deny
        match: country
        value: ALL
    mtls:
      enabled: true
      # !!DANGER!! INDENTATION MUST BE BAKED INTO THE ENV VAR, READ FROM OP SECRET, BC FOSRL DOES NOT HANDLE IT PROPERLY
      ca-certificates:
        - |
          {{env.MTLS_CA_CERT}}
