[settings]
#python.uv_venv_auto = "create|source"

[tools]
fnox = { version = "latest", lazy = true }
pulumi = { version = "latest", lazy = true }
uv = { version = "latest", lazy = true }
"github:fosrl/cli" = { version = "latest", rename_exe = "pangolin" }

[env]
DOCKER_HOST = "ssh://chris@chenn.dev:2200"
DIR_HOST = "/home/chris/Projects/homelab/vps0"
DATA = "/home/chris/data"
BACKUP = "/home/chris/backup"

[tasks.policies]
description = "Apply pangolin blueprint with shared access policies"
run = "pangolin apply blueprint --file $REPO/vps0/apps/pangolin/policies.yml"

[tasks.uv]
run = "uv venv create --allow-existing && uv sync"
sources = ["./uv.lock"]
outputs = [".venv"]
cache = { enabled = true }
