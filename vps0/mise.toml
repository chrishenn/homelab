[settings]
python.uv_venv_auto = "create|source"

[tools]
fnox = "latest"
pulumi = "latest"
uv = "latest"

[env]
DOCKER_HOST = "ssh://chris@${VPS0_IP}:2200"
DIR_HOST = "/home/chris/Projects/homelab/vps0"
DATA = "/home/chris/data"
BACKUP = "/home/chris/backup"

##
## ubuntu server (vps0)
##
[bootstrap.remote.hosts.vps0]
host = "chenn.dev"
user = "chris"
port = 2200
identity_file = "~/.ssh/known_hosts"
tags = ["production"]

[bootstrap.user]
login_shell = "/bin/bash"

[bootstrap.groups.chris]
system = true
gid = 1000

[bootstrap.users.chris]
system = true
group = "chris"
groups = ["docker", "incus-admin", "libvirt"]
uid = 1000

# sysctl
[bootstrap.files."/etc/sysctl.d/99-custom.conf"]
content = """
net.ipv4.ip_nonlocal_bind=1
vm.overcommit_memory=1
fs.inotify.max_user_watches=1014796
fs.inotify.max_user_instances=1014796
fs.inotify.max_queued_events=1014796
net.ipv6.conf.all.disable_ipv6=1
"""
owner = "root"
group = "root"
mode = "0644"

# docker
[bootstrap.files."/etc/docker/daemon.json"]
content = """
{
    "registry-mirrors": ["https://zot.henn.dev"],
    "default-runtime": "nvidia",
    "runtimes": {
        "nvidia": {
            "args": [],
            "path": "nvidia-container-runtime"
        }
    },
    "log-level": "warn",
    "log-driver": "json-file",
    "log-opts": {
        "max-size": "10m",
        "max-file": "5"
    },
    "default-address-pools": [
        {
            "base": "172.16.0.0/12",
            "size": 24
        }
    ]
}
"""
owner = "root"
group = "root"
mode = "0644"
notify = ["docker"]

# sshd
[bootstrap.files."/etc/ssh/sshd_config"]
content = """
Include /etc/ssh/sshd_config.d/*.conf
PasswordAuthentication no
KbdInteractiveAuthentication no
UsePAM yes
X11Forwarding yes
PrintMotd no
AcceptEnv LANG LC_* COLORTERM NO_COLOR
Subsystem       sftp    /usr/lib/openssh/sftp-server
Port 2200
PermitRootLogin no
"""
owner = "root"
group = "root"
mode = "0644"

[bootstrap.hooks.final]
run = """
# sysctl settings apply
sudo sysctl --system -q
"""

[bootstrap.services.docker]
state = "running"
enabled = true
on_change = "reload_or_restart"

[bootstrap.repos]
"~/Projects/homelab" = { url = "https://github.com/chrishenn/homelab" }