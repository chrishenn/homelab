[settings]
python.uv_venv_auto = "create|source"

[tools]
fnox = "latest"
pulumi = "latest"
uv = "latest"

[env]
DOCKER_HOST = "ssh://chris@chenn.dev:2200"
DIR_HOST = "/home/chris/Projects/homelab/vps0"
DATA = "/home/chris/data"
BACKUP = "/home/chris/backup"

## ubuntu server (vps0)
##
# todo: initial bootstrap should connect as root
# todo: bootstrap creates the 'chris' user with no password - need to set after
# echo "chris:$(op read 'op://homelab/vps0/chris_pass')" | $SSH_ROOT "chpasswd"
[bootstrap.remote.hosts.vps0]
host = "chenn.dev"
# user = "root"
# port = 22
user = "chris"
port = 2200
tags = ["production"]

[bootstrap.user]
login_shell = "/bin/bash"

[bootstrap.groups.ubuntu]
system = true
gid = 1000

[bootstrap.users.ubuntu]
system = true
group = "ubuntu"
groups = ["adm", "cdrom", "sudo", "dip", "lxd"]
uid = 1000

[bootstrap.groups.chris]
system = true
gid = 1001

[bootstrap.users.chris]
system = true
group = "chris"
groups = ["sudo", "users", "docker"]
uid = 1001

[bootstrap.linux.firewall]
backend = "ufw"
state = "disabled"

# sysctl
[bootstrap.files."/etc/sysctl.d/99-custom.conf"]
content = """
net.ipv4.ip_nonlocal_bind=1
vm.overcommit_memory=1
fs.inotify.max_user_watches=1014796
fs.inotify.max_user_instances=1014796
fs.inotify.max_queued_events=1014796
net.ipv6.conf.all.disable_ipv6 = 0
net.ipv6.conf.default.disable_ipv6 = 0
net.ipv6.conf.lo.disable_ipv6 = 0
"""
owner = "root"
group = "root"
mode = "0644"

# docker
[bootstrap.files."/etc/docker/daemon.json"]
content = """
{
    "log-level": "warn",
    "log-driver": "json-file",
    "log-opts": {
        "max-size": "10m",
        "max-file": "5"
    }
}
"""
owner = "root"
group = "root"
mode = "0644"
notify = ["docker"]

# sshd
[bootstrap.files."/etc/ssh/sshd_config"]
content = """
AcceptEnv LANG LC_* COLORTERM NO_COLOR
Include /etc/ssh/sshd_config.d/*.conf
KbdInteractiveAuthentication no
PasswordAuthentication no
PermitRootLogin no
Port 2200
PrintMotd no
Subsystem       sftp    /usr/lib/openssh/sftp-server
UsePAM yes
X11Forwarding yes
"""
owner = "root"
group = "root"
mode = "0644"

# todo: verify that this env is evaluated locally, then piped into the remote bootstrap
[bootstrap.hooks.final]
run = """
sudo sysctl -q --system
echo "$VPS0_CHRIS_PASS"
# echo "${VPS0_CHRIS_PASS}" | sudo chpasswd
"""

[bootstrap.services.docker]
state = "running"
enabled = true
on_change = "reload_or_restart"

[bootstrap.repos]
"/home/chris/Projects/homelab" = { url = "https://github.com/chrishenn/homelab" }
