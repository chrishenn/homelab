[settings]
env_shell_expand = true

[monorepo]
# only python subprojects require a local mise+uv env when running (eg) "ty check"
config_roots = [".", "dns", "k3s", "protonmail", "traefik", "vps0"]

[tools]
"aqua:anordal/shellharden" = "latest"
"aqua:owenlamont/ryl" = "latest"
"github:mongodb/kingfisher" = "latest"
"npm:dclint" = "latest"
"pipx:mypy" = "latest"
betterleaks = "latest"
bun = "latest"
gitleaks = "latest"
hk = "latest"
just = "latest"
oxfmt = "latest"
pkl = "latest"
pnpm = "latest"
ruff = "latest"
shellcheck = "latest"
shfmt = "latest"
ty = "latest"
uv = "latest"

[env]
REPO = "{{ config_root | absolute }}"
REPO_NAME = "{{ config_root | basename }}"
HK_MISE = 1

# This env will be inherited into subprojects when hk runs ty in each one, setting this shared ty config
TY_CONFIG_FILE = "$REPO/.ty.toml"

# registries
REGISTRY = "zot.henn.dev"
REGISTRY_URL = "https://zot.henn.dev"
BERG_USR = "chris"
BERG_BASE_URL = "forgejo.henn.dev"
BERG_SSH_PORT = 2424

# settings for: {virtual IP, keepalived} {traefik, blocky}
DNS_VIP = "192.168.1.3"
DNS_VIP_CIDR = "192.168.1.3/24"
TRAEFIK_VIP = "192.168.1.4"
TRAEFIK_VIP_CIDR = "192.168.1.4/24"
KEEPALIVE_MASTER = "192.168.1.142"
KEEPALIVE_BACKUP = "192.168.1.70"
KEEPALIVE_PASS = "E@!#3f$%"
RACK0_NIC = "nic0"
RACK4_NIC = "enp47s0np0"

# lancache dns
LANCACHE_IP = "192.168.1.143"
LANCACHE_DNS = "192.168.1.143"

# cuelang settings
CUE_DEBUG = "sortfields"

[tasks.slow]
description = "run slow project linters declared in hk.pkl"
run = "hk run slow --all"
