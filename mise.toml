[settings]
env_shell_expand = true

[monorepo]
# only python subprojects require a local mise+uv env when running (eg) "ty check"
config_roots = [".", "dns", "k3s", "protonmail", "traefik", "rack3", "vps0"]

[tools]
"aqua:anordal/shellharden" = { version = "latest", lazy = true, lazy_bins = ["shellharden"] }
"aqua:owenlamont/ryl" = { version = "latest", lazy = true, lazy_bins = ["ryl"] }
"github:mongodb/kingfisher" = { version = "latest", lazy = true, lazy_bins = ["kingfisher"] }
"npm:dclint" = { version = "latest", lazy = true, lazy_bins = ["dclint"] }
"pipx:mypy" = { version = "latest", lazy = true, lazy_bins = ["mypy"] }
betterleaks = { version = "latest", lazy = true }
bun = { version = "latest", lazy = true }
gitleaks = { version = "latest", lazy = true }
hk = { version = "latest", lazy = true }
just = { version = "latest", lazy = true }
oxfmt = { version = "latest", lazy = true }
pkl = { version = "latest", lazy = true }
pnpm = { version = "latest", lazy = true }
ruff = { version = "latest", lazy = true }
shellcheck = { version = "latest", lazy = true }
shfmt = { version = "latest", lazy = true }
ty = { version = "latest", lazy = true }
uv = { version = "latest", lazy = true }
node = { version = "latest", lazy = true }
lychee = "latest"

[env]
REPO = "{{ config_root | absolute }}"
REPO_NAME = "{{ config_root | basename }}"
HK_MISE = 1

# This env will be inherited into subprojects when hk runs ty in each one, setting this shared ty config
TY_CONFIG_FILE = "$REPO/.ty.toml"

# registries
REGISTRY = "zot.henn.dev"
REGISTRY_URL = "https://zot.henn.dev"
BERG_USR = "chris"
BERG_BASE_URL = "forgejo.henn.dev"
BERG_SSH_PORT = 2424

# cuelang settings
CUE_DEBUG = "sortfields"

[tasks.slow]
description = "run slow project linters declared in hk.pkl"
run = "hk run slow --all"
